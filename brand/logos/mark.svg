<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Docent">
  <!-- The tile: ultramarine, the one ink of the brand. -->
  <rect width="64" height="64" rx="14" fill="#2f3fd0"/>
  <!-- The path: a letter D drawn as one route. It stops short of closing. -->
  <path d="M20 37V18H30A14 14 0 0 1 30 46H29" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The dot: the lamp, at the corner where the route would close. It is the moving dot of a workflow diagram. -->
  <circle cx="20" cy="46" r="4" fill="#f2b824"/>
</svg>
