<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 64" width="224" height="64" role="img" aria-label="Docent" style="color:#1c1f2e">
  <!-- Lockup: the mark and the wordmark. The wordmark uses currentColor, so an inline copy follows the page text color in dark mode. -->
  <rect width="64" height="64" rx="14" fill="#2f3fd0"/>
  <path d="M20 37V18H30A14 14 0 0 1 30 46H29" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="46" r="4" fill="#f2b824"/>
  <!-- The wordmark is live text in the heading serif. It uses the reader's system font, so its shape differs a little between devices. -->
  <text x="80" y="44" font-family="Charter, 'Bitstream Charter', 'Sitka Heading', 'Sitka Text', Cambria, Georgia, serif" font-size="36" font-weight="700" letter-spacing="-0.36" fill="currentColor">Docent</text>
</svg>
