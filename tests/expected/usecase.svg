#dg-shop-usecases .u-op{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e)}
@media (prefers-reduced-motion:reduce){#dg-shop-usecases .pulse{animation:none!important}#dg-shop-usecases .pulse{display:none!important}}
@media print{#dg-shop-usecases{max-width:100%;height:auto}#dg-shop-usecases .pulse{display:none!important}}
#dg-shop-usecases-phone{display:none}
