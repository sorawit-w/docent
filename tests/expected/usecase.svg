<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<p>The system: Online shop.</p>
<ul><li>Customer takes part in “Browse the catalog” and “Place an order”.</li><li>Member takes part in “Track an order”. Member is a kind of Customer, and takes part in all that Customer does.</li><li>Payment service takes part in “Pay”.</li></ul>
<ul><li>“Place an order” always includes “Pay”.</li><li>“Apply a coupon” may add to “Place an order”, under a condition.</li></ul>
<p>Key to the marks:</p>
<ul><li>A stick figure: an actor, a person or another system that uses this one.</li><li>An oval: a use case, something an actor does with the system.</li><li>The large box with the system's name: what is inside it is part of the system.</li><li>A solid line: the actor takes part in the use case.</li><li>A dashed line with an open arrowhead, marked «include»: the first use case always uses the second.</li><li>A dashed line with an open arrowhead, marked «extend»: the first use case may add to the second, under a condition.</li><li>A solid line with a hollow triangle: the actor or use case at the line's start is a kind of the one at the triangle.</li></ul>
</details>
