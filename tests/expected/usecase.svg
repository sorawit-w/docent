#dg-shop-usecases .leg .line{stroke-width:1.5}
#dg-shop-usecases .leg.is-reply .line{stroke-dasharray:6 4;stroke-linecap:butt}
#dg-shop-usecases .ohead{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.js #dg-shop-usecases .leg.is-current .ohead{stroke:var(--primary,#2f3fd0)}
