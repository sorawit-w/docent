<svg id="dg-shop-usecases" class="dg dg-usecase dg-auto" xmlns="http://www.w3.org/2000/svg" width="888" height="504" viewBox="0 0 888 504" role="img" aria-label="Customers browse the catalog and place orders; placing an order always includes paying, and a coupon may be applied. Members are customers who can also track orders. The payment service takes part in paying.">
<style>
#dg-shop-usecases{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-shop-usecases .ground{fill:var(--fig,#f2f3f9)}
