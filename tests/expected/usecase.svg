#dg-shop-usecases .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-shop-usecases .stop.end{fill:var(--text,#1c1f2e)}
#dg-shop-usecases .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-shop-usecases .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
