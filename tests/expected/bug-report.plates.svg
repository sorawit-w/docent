<svg id="dg-path" class="dg dg-plates dg-auto" xmlns="http://www.w3.org/2000/svg" width="780" height="546" viewBox="0 0 780 546" role="img" aria-label="A bug report in four steps: the reporter files a report, the maintainers ask for steps, the reporter sends the steps, and the maintainers release a fix.">
<style>
#dg-path{display:block;flex:none;margin-inline:auto;font-family:var(--sans,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif)}
#dg-path .ground{fill:var(--fig,#f2f3f9)}
#dg-path .band{fill:var(--bg,#fbfbfe)}
#dg-path .track{stroke:var(--line,#d3d6e3)}
#dg-path .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-path .head{fill:var(--text,#1c1f2e)}
#dg-path .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-path .stop.end{fill:var(--text,#1c1f2e)}
#dg-path .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-path .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-path .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-path .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-path .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-path .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-path .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-path .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-path .sub,#dg-path .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-path .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
.js #dg-path .pulse{display:block;animation:7.6s linear 2 both}
.js #dg-path:not(.is-playing) .pulse{animation-play-state:paused}
@keyframes dg-path-1{0%{transform:translate(310px,116px);opacity:0}1.58%{transform:translate(310px,116px);opacity:1}6.25%{transform:translate(310px,168px);opacity:1}17.76%{transform:translate(438px,168px);opacity:1}21.05%{transform:translate(438px,168px);opacity:0}100%{transform:translate(438px,168px);opacity:0}}
.js #dg-path .pulse-1{animation-name:dg-path-1}
@keyframes dg-path-2{0%{transform:translate(470px,208px);opacity:0}21.05%{transform:translate(470px,208px);opacity:0}22.63%{transform:translate(470px,208px);opacity:1}27.31%{transform:translate(470px,260px);opacity:1}38.82%{transform:translate(342px,260px);opacity:1}42.11%{transform:translate(342px,260px);opacity:0}100%{transform:translate(342px,260px);opacity:0}}
.js #dg-path .pulse-2{animation-name:dg-path-2}
@keyframes dg-path-3{0%{transform:translate(310px,300px);opacity:0}42.11%{transform:translate(310px,300px);opacity:0}43.68%{transform:translate(310px,300px);opacity:1}48.36%{transform:translate(310px,352px);opacity:1}59.87%{transform:translate(438px,352px);opacity:1}63.16%{transform:translate(438px,352px);opacity:0}100%{transform:translate(438px,352px);opacity:0}}
.js #dg-path .pulse-3{animation-name:dg-path-3}
@keyframes dg-path-4{0%{transform:translate(590px,392px);opacity:0}63.16%{transform:translate(590px,392px);opacity:0}64.74%{transform:translate(590px,392px);opacity:1}80.92%{transform:translate(590px,464px);opacity:1}84.21%{transform:translate(590px,464px);opacity:0}100%{transform:translate(590px,464px);opacity:0}}
.js #dg-path .pulse-4{animation-name:dg-path-4}
@media (prefers-reduced-motion:reduce){#dg-path .pulse{animation:none!important}#dg-path .pulse{display:none!important}}
@media print{#dg-path .pulse{display:none!important}}
</style>
<rect width="780" height="546" class="ground"/>
<rect x="12" y="12" width="356" height="522" rx="10" class="band"/>
<rect x="412" y="12" width="356" height="522" rx="10" class="band"/>
<g class="icon lane-icon" transform="translate(40,31)"><circle cx="8" cy="5" r="2.5"/><path d="M3 13.5c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5"/></g>
<text x="64" y="44" class="lane" text-anchor="start">Reporter</text>
<g class="icon lane-icon" transform="translate(440,31)"><circle cx="6" cy="5.5" r="2.25"/><path d="M1.75 13c0-2.4 1.9-3.75 4.25-3.75s4.25 1.35 4.25 3.75M10.5 3.5a2.25 2.25 0 0 1 0 4.25M12 9.6c1.4.5 2.25 1.7 2.25 3.4"/></g>
<text x="464" y="44" class="lane" text-anchor="start">Maintainers</text>
<g class="leg" data-leg="1"><path d="M310,116 L310,160 Q310,168 318,168 L432,168" class="line"/><polygon points="430,172.5 430,163.5 438,168" class="head"/><circle cx="390" cy="168" r="10" class="mark"/><text x="390" y="172" class="num" text-anchor="middle">1</text><text x="390" y="149" class="verb" text-anchor="middle">file</text><circle r="6" class="pulse pulse-1"/></g>
<g class="leg" data-leg="2"><path d="M470,208 L470,252 Q470,260 462,260 L348,260" class="line"/><polygon points="350,255.5 350,264.5 342,260" class="head"/><circle cx="390" cy="260" r="10" class="mark"/><text x="390" y="264" class="num" text-anchor="middle">2</text><text x="390" y="241" class="verb" text-anchor="middle">ask for steps</text><circle r="6" class="pulse pulse-2"/></g>
<g class="leg" data-leg="3"><path d="M310,300 L310,344 Q310,352 318,352 L432,352" class="line"/><polygon points="430,356.5 430,347.5 438,352" class="head"/><circle cx="390" cy="352" r="10" class="mark"/><text x="390" y="356" class="num" text-anchor="middle">3</text><text x="390" y="333" class="verb" text-anchor="middle">send steps</text><circle r="6" class="pulse pulse-3"/></g>
<g class="leg" data-leg="4"><path d="M590,392 L590,458" class="line"/><polygon points="585.5,456 594.5,456 590,464" class="head"/><circle cx="590" cy="424" r="10" class="mark"/><text x="590" y="428" class="num" text-anchor="middle">4</text><text x="606" y="428" class="verb" text-anchor="start">release</text><circle r="6" class="pulse pulse-4"/></g>
<rect x="40" y="64" width="300" height="52" rx="10" class="card"/>
<g class="icon" transform="translate(56,82)"><path d="M9.5 2.5h-5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-7z"/><path d="M9.5 2.5v3h3M6 9h4M6 11.25h4"/></g>
<text x="86" y="87" class="name" text-anchor="start">Bug report</text>
<text x="86" y="104" class="sub" text-anchor="start">what went wrong</text>
<rect x="440" y="156" width="300" height="52" rx="10" class="card"/>
<g class="icon" transform="translate(456,174)"><circle cx="7" cy="7" r="4"/><path d="M10 10l3.5 3.5"/></g>
<text x="486" y="179" class="name" text-anchor="start">Triage</text>
<text x="486" y="196" class="sub" text-anchor="start">a first check</text>
<rect x="40" y="248" width="300" height="52" rx="10" class="card"/>
<g class="icon" transform="translate(56,266)"><path d="M2.5 4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H7l-3 2.5v-2.5h-.5a1 1 0 0 1-1-1z"/><path d="M5.5 6.25h5M5.5 8.5h3"/></g>
<text x="86" y="271" class="name" text-anchor="start">Steps to repeat</text>
<text x="86" y="288" class="sub" text-anchor="start">a short, exact list</text>
<rect x="440" y="340" width="300" height="52" rx="10" class="card"/>
<g class="icon" transform="translate(456,358)"><circle cx="8" cy="8" r="5.5"/><path d="M5.5 8.2l1.8 1.8 3.2-3.6"/></g>
<text x="486" y="363" class="name" text-anchor="start">Fix</text>
<text x="486" y="380" class="sub" text-anchor="start">a tested change</text>
<rect x="440" y="466" width="300" height="52" rx="10" class="card"/>
<g class="icon" transform="translate(456,484)"><path d="M2.5 8.4V3.5a1 1 0 0 1 1-1h4.9l5.1 5.1a1 1 0 0 1 0 1.4l-4.5 4.5a1 1 0 0 1-1.4 0z"/><path d="M5.6 5.6h.01"/></g>
<text x="486" y="489" class="name" text-anchor="start">New version</text>
<text x="486" y="506" class="sub" text-anchor="start">ready to install</text>
</svg>
