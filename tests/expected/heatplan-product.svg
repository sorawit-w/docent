<svg id="dg-product-clicks" class="dg dg-heatplan dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="382" viewBox="0 0 640 382" role="img" aria-label="Clicks on each area of a product page in one week. The Add to cart box got the most, 870, and the photo gallery the next most, 610. The footer got the fewest, 60. The help chat was not tracked.">
<style>
#dg-product-clicks{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-product-clicks .ground{fill:var(--fig,#f2f3f9)}
#dg-product-clicks .band{fill:var(--bg,#fbfbfe)}
#dg-product-clicks .track{stroke:var(--line,#d3d6e3)}
#dg-product-clicks .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-product-clicks .head{fill:var(--text,#1c1f2e)}
#dg-product-clicks .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-product-clicks .stop.end{fill:var(--text,#1c1f2e)}
#dg-product-clicks .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-product-clicks .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-product-clicks .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-product-clicks .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-product-clicks .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-product-clicks .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-product-clicks .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-product-clicks .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-product-clicks .sub,#dg-product-clicks .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-product-clicks .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-product-clicks .row{font-size:14px;fill:var(--text,#1c1f2e)}
#dg-product-clicks .val{font-size:12px;fill:var(--muted,#575d75);font-variant-numeric:tabular-nums}
#dg-product-clicks .box{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-product-clicks .h1{fill:var(--heat-1,#dee2f0)}
#dg-product-clicks .h2{fill:var(--heat-2,#babecb)}
#dg-product-clicks .h3{fill:var(--heat-3,#9498a5)}
#dg-product-clicks .h4{fill:var(--heat-4,#616571)}
#dg-product-clicks .h5{fill:var(--heat-5,#3e424d)}
#dg-product-clicks .hv{font-size:12px;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-product-clicks .hn{font-size:12px;fill:var(--text,#1c1f2e)}
#dg-product-clicks .row.hi,#dg-product-clicks .hv.hi,#dg-product-clicks .hn.hi{fill:var(--bg,#fbfbfe)}
@media (prefers-reduced-motion:reduce){#dg-product-clicks .pulse{animation:none!important}#dg-product-clicks .pulse{display:none!important}}
@media print{#dg-product-clicks{max-width:100%;height:auto}#dg-product-clicks .pulse{display:none!important}}
#dg-product-clicks-phone{display:none}
</style>
