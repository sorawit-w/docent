<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<div class="table-wrap is-text" role="region" aria-label="The boxes of the heat plan" tabindex="0"><table><thead><tr><th scope="col">Box</th><th scope="col">Value</th><th scope="col">Row</th><th scope="col">Column</th><th scope="col">Width</th><th scope="col">Note</th></tr></thead><tbody><tr><th scope="row">Header</th><td>420</td><td>top</td><td>full width</td><td>1440</td><td>search and menu</td></tr><tr><th scope="row">Photo gallery</th><td>610</td><td>row 2</td><td>left</td><td>480</td><td></td></tr><tr><th scope="row">Product details</th><td>240</td><td>row 2</td><td>middle</td><td>480</td><td></td></tr><tr><th scope="row">Add to cart</th><td>870</td><td>row 2</td><td>right</td><td>480</td><td>price and size</td></tr><tr><th scope="row">Reviews</th><td>430</td><td>row 3</td><td>columns 1 to 2</td><td>960</td><td></td></tr><tr><th scope="row">Related items</th><td>150</td><td>row 3</td><td>right</td><td>480</td><td></td></tr><tr><th scope="row">Footer</th><td>60</td><td>bottom</td><td>columns 1 to 2</td><td>960</td><td></td></tr><tr><th scope="row">Help chat</th><td>no data</td><td>bottom</td><td>right</td><td>480</td><td>not tracked</td></tr></tbody></table></div>
<p>Widths are in px. The rows are not drawn to scale.</p>
<ul><li>Each box is shaded by its number, in 5 steps of 200 clicks from 0 to 1000. A number on the edge of two steps takes the higher step.</li><li>The highest number is 870 (Add to cart). The lowest is 60 (Footer).</li><li>1 box has no data.</li></ul>
</details>
