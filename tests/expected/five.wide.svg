<svg id="dg-five" class="dg dg-wide dg-auto" xmlns="http://www.w3.org/2000/svg" width="822" height="636" viewBox="0 0 822 636" role="img" aria-label="A change passes five teams: the author writes it, a reviewer reads it, the build makes it, the testers try it, and the release team ships it.">
<style>
#dg-five{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-five .ground{fill:var(--fig,#f2f3f9)}
#dg-five .band{fill:var(--bg,#fbfbfe)}
#dg-five .track{stroke:var(--line,#d3d6e3)}
#dg-five .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-five .head{fill:var(--text,#1c1f2e)}
#dg-five .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-five .stop.end{fill:var(--text,#1c1f2e)}
#dg-five .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-five .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-five .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-five .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-five .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-five .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-five .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-five .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-five .sub,#dg-five .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-five .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
.js #dg-five .pulse{display:block;animation:7.6s linear 2 both}
.js #dg-five:not(.is-playing) .pulse{animation-play-state:paused}
@keyframes dg-five-1{0%{transform:translate(168px,88px);opacity:0}1.58%{transform:translate(168px,88px);opacity:1}2.87%{transform:translate(181px,88px);opacity:1}14.08%{transform:translate(251px,176px);opacity:1}17.76%{transform:translate(288px,176px);opacity:1}21.05%{transform:translate(288px,176px);opacity:0}100%{transform:translate(288px,176px);opacity:0}}
.js #dg-five .pulse-1{animation-name:dg-five-1}
@keyframes dg-five-2{0%{transform:translate(308px,176px);opacity:0}21.05%{transform:translate(308px,176px);opacity:0}22.63%{transform:translate(308px,176px);opacity:1}23.73%{transform:translate(321px,176px);opacity:1}35.7%{transform:translate(391px,300px);opacity:1}38.82%{transform:translate(428px,300px);opacity:1}42.11%{transform:translate(428px,300px);opacity:0}100%{transform:translate(428px,300px);opacity:0}}
.js #dg-five .pulse-2{animation-name:dg-five-2}
@keyframes dg-five-3{0%{transform:translate(448px,300px);opacity:0}42.11%{transform:translate(448px,300px);opacity:0}43.68%{transform:translate(448px,300px);opacity:1}45.66%{transform:translate(473px,300px);opacity:1}56.94%{transform:translate(543px,424px);opacity:1}59.87%{transform:translate(580px,424px);opacity:1}63.16%{transform:translate(580px,424px);opacity:0}100%{transform:translate(580px,424px);opacity:0}}
.js #dg-five .pulse-3{animation-name:dg-five-3}
@keyframes dg-five-4{0%{transform:translate(600px,424px);opacity:0}63.16%{transform:translate(600px,424px);opacity:0}64.74%{transform:translate(600px,424px);opacity:1}66.72%{transform:translate(625px,424px);opacity:1}77.99%{transform:translate(695px,548px);opacity:1}80.92%{transform:translate(732px,548px);opacity:1}84.21%{transform:translate(732px,548px);opacity:0}100%{transform:translate(732px,548px);opacity:0}}
.js #dg-five .pulse-4{animation-name:dg-five-4}
@media (prefers-reduced-motion:reduce){#dg-five .pulse{animation:none!important}#dg-five .pulse{display:none!important}}
@media print{#dg-five{max-width:100%;height:auto}#dg-five .pulse{display:none!important}}
#dg-five-phone{display:none}
</style>
