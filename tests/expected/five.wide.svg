<circle cx="158" cy="88" r="8" class="stop"/>
<text x="158" y="46" class="name" text-anchor="middle">Change</text>
<text x="158" y="63" class="sub" text-anchor="middle">a short diff</text>
<circle cx="298" cy="176" r="8" class="stop"/>
<text x="298" y="211" class="name" text-anchor="middle">Review</text>
<text x="298" y="228" class="sub" text-anchor="middle">read once</text>
<circle cx="438" cy="300" r="8" class="stop"/>
<text x="438" y="335" class="name" text-anchor="middle">Build</text>
<text x="438" y="352" class="sub" text-anchor="middle">made and packed</text>
<circle cx="590" cy="424" r="8" class="stop"/>
<text x="590" y="459" class="name" text-anchor="middle">Trial</text>
<text x="590" y="476" class="sub" text-anchor="middle">on a test machine</text>
<circle cx="742" cy="548" r="8" class="stop end"/>
<text x="742" y="583" class="name" text-anchor="middle">Release</text>
<text x="742" y="600" class="sub" text-anchor="middle">for everyone</text>
</svg>
