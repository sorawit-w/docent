<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<div class="table-wrap is-text" role="region" aria-label="The boxes of the heat plan" tabindex="0"><table><thead><tr><th scope="col">Box</th><th scope="col">Value</th><th scope="col">Row</th><th scope="col">Column</th><th scope="col">Note</th></tr></thead><tbody><tr><th scope="row">Search</th><td>460</td><td>top</td><td>full width</td><td></td></tr><tr><th scope="row">Topics</th><td>210</td><td>rows 2 to 3</td><td>left</td><td></td></tr><tr><th scope="row">Article</th><td>90</td><td>middle</td><td>columns 2 to 3</td><td>links in the text</td></tr><tr><th scope="row">Related articles</th><td>130</td><td>rows 2 to 3</td><td>right</td><td></td></tr><tr><th scope="row">Was this helpful?</th><td>320</td><td>bottom</td><td>column 2</td><td></td></tr><tr><th scope="row">Contact support</th><td>180</td><td>bottom</td><td>column 3</td><td></td></tr></tbody></table></div>
<p>The plan is not drawn to scale. On a phone each box stands on its own, beside a small map of the plan.</p>
<ul><li>Each box is shaded by its number, in 5 steps of 100 clicks from 0 to 500. A number on the edge of two steps takes the higher step.</li><li>The highest number is 460 (Search). The lowest is 90 (Article).</li></ul>
</details>
