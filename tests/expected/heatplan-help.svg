<svg id="dg-help-clicks" class="dg dg-heatplan dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="274" viewBox="0 0 640 274" role="img" aria-label="Clicks on each area of a help page in one week. Search got the most, 460, and the question 'Was this helpful?' the next most, 320. Links inside the article got the fewest, 90.">
<style>
#dg-help-clicks{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-help-clicks .ground{fill:var(--fig,#f2f3f9)}
#dg-help-clicks .band{fill:var(--bg,#fbfbfe)}
#dg-help-clicks .track{stroke:var(--line,#d3d6e3)}
#dg-help-clicks .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-help-clicks .head{fill:var(--text,#1c1f2e)}
#dg-help-clicks .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-help-clicks .stop.end{fill:var(--text,#1c1f2e)}
#dg-help-clicks .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-help-clicks .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-help-clicks .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-help-clicks .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-help-clicks .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-help-clicks .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-help-clicks .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-help-clicks .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-help-clicks .sub,#dg-help-clicks .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-help-clicks .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-help-clicks .row{font-size:14px;fill:var(--text,#1c1f2e)}
#dg-help-clicks .val{font-size:12px;fill:var(--muted,#575d75);font-variant-numeric:tabular-nums}
#dg-help-clicks .box{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-help-clicks .h1{fill:var(--heat-1,#c6e9ef)}
#dg-help-clicks .h2{fill:var(--heat-2,#86c9d5)}
#dg-help-clicks .h3{fill:var(--heat-3,#3da6b6)}
#dg-help-clicks .h4{fill:var(--heat-4,#00707e)}
#dg-help-clicks .h5{fill:var(--heat-5,#004a53)}
#dg-help-clicks .hv{font-size:12px;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-help-clicks .hn{font-size:12px}
#dg-help-clicks .hs{fill:var(--heat-text,#1c1f2e)}
#dg-help-clicks .hs.hi{fill:var(--heat-page,#fbfbfe)}
@media (prefers-reduced-motion:reduce){#dg-help-clicks .pulse{animation:none!important}#dg-help-clicks .pulse{display:none!important}}
@media print{#dg-help-clicks{max-width:100%;height:auto}#dg-help-clicks .pulse{display:none!important}}
#dg-help-clicks-phone{display:none}
</style>
