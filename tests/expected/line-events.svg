<svg id="dg-reports-by-month" class="dg dg-line dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="328" viewBox="0 0 640 328" role="img" aria-label="Sign-in reports rose from 62 in January to 138 in June, after the new sign-in page in May, then fell to 66 in December after the fix in July. Search and Checkout stayed between 28 and 52 all year.">
