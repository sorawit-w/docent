<svg id="dg-docs-page" class="dg dg-plan dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="208" viewBox="0 0 640 208" role="img" aria-label="A documentation page 1440px wide. A header runs across the top and a footer across the bottom. Between them, the navigation is on the left, the text in the middle, and an 'On this page' list on the right.">
<style>
#dg-docs-page{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-docs-page .ground{fill:var(--fig,#f2f3f9)}
#dg-docs-page .band{fill:var(--bg,#fbfbfe)}
#dg-docs-page .track{stroke:var(--line,#d3d6e3)}
#dg-docs-page .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-docs-page .head{fill:var(--text,#1c1f2e)}
#dg-docs-page .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-docs-page .stop.end{fill:var(--text,#1c1f2e)}
#dg-docs-page .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-docs-page .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-docs-page .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-docs-page .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-docs-page .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-docs-page .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-docs-page .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-docs-page .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-docs-page .sub,#dg-docs-page .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-docs-page .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-docs-page .row{font-size:14px;fill:var(--text,#1c1f2e)}
#dg-docs-page .val{font-size:12px;fill:var(--muted,#575d75);font-variant-numeric:tabular-nums}
#dg-docs-page .box{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
@media (prefers-reduced-motion:reduce){#dg-docs-page .pulse{animation:none!important}#dg-docs-page .pulse{display:none!important}}
@media print{#dg-docs-page{max-width:100%;height:auto}#dg-docs-page .pulse{display:none!important}}
#dg-docs-page-phone{display:none}
</style>
<rect width="640" height="208" class="ground"/>
<rect x="8" y="52" width="624" height="144" rx="10" class="band"/>
<text x="12" y="24" class="sub" text-anchor="start">Widths in px</text>
<text x="63.33" y="44" class="val" text-anchor="middle">240</text>
<text x="320" y="44" class="val" text-anchor="middle">960</text>
<text x="576.67" y="44" class="val" text-anchor="middle">240</text>
<rect x="14" y="58" width="612" height="36" rx="4" class="box"/>
<text x="22" y="80" class="row" text-anchor="start">Header</text>
<rect x="14" y="98" width="98.67" height="52" rx="4" class="box"/>
<text x="22" y="120" class="row" text-anchor="start">Navigation</text>
<rect x="116.67" y="98" width="406.67" height="52" rx="4" class="box"/>
<text x="124.67" y="120" class="row" text-anchor="start">Text</text>
<rect x="527.33" y="98" width="98.67" height="52" rx="4" class="box"/>
<text x="535.33" y="120" class="row" text-anchor="start">On this</text>
<text x="535.33" y="138" class="row" text-anchor="start">page</text>
<rect x="14" y="154" width="612" height="36" rx="4" class="box"/>
<text x="22" y="176" class="row" text-anchor="start">Footer</text>
</svg>
<svg id="dg-docs-page-phone" class="dg dg-plan dg-auto" xmlns="http://www.w3.org/2000/svg" width="264" height="226" viewBox="0 0 264 226" role="img" aria-label="A documentation page 1440px wide. A header runs across the top and a footer across the bottom. Between them, the navigation is on the left, the text in the middle, and an 'On this page' list on the right.">
<style>
