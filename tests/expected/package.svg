#dg-shop-packages .sub,#dg-shop-packages .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-shop-packages .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
