@media (prefers-reduced-motion:reduce){#dg-shop-packages .pulse{animation:none!important}#dg-shop-packages .pulse{display:none!important}}
@media print{#dg-shop-packages{max-width:100%;height:auto}#dg-shop-packages .pulse{display:none!important}}
