<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<ul><li>The package Shop, holds the packages Ordering, Catalog, Billing.</li><li>The package Ordering, inside Shop, holds “Order”, “OrderLine”, “Cart”.</li><li>The package Catalog, inside Shop, holds “Product”, “Category”.</li><li>The package Billing, inside Shop, holds “Invoice”, “Payment”.</li><li>The package Shared utilities, holds “Money”, “Clock”.</li></ul>
<ul><li>Ordering imports Catalog.</li><li>Ordering uses, without passing on, Billing.</li><li>Shop imports Shared utilities.</li></ul>
<p>Key to the marks:</p>
<ul><li>A folder: a package, its name in the tab, and what it holds in its body.</li><li>A dashed line with an open arrowhead: the package at the line's start needs the package at the arrowhead.</li><li>«import»: the first package uses the public names of the second as its own, and passes them on.</li><li>«access»: the first package uses the public names of the second, but does not pass them on.</li></ul>
</details>
