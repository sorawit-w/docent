<svg id="dg-shop-packages" class="dg dg-package dg-auto" xmlns="http://www.w3.org/2000/svg" width="672" height="528" viewBox="0 0 672 528" role="img" aria-label="The shop has three packages: ordering, catalog and billing. Ordering imports the catalog and uses billing; all of the shop imports the shared utilities.">
<style>
#dg-shop-packages{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-shop-packages .ground{fill:var(--fig,#f2f3f9)}
