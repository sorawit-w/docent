<text x="674" y="46" class="name" text-anchor="middle">Checksum</text>
<text x="674" y="63" class="sub" text-anchor="middle">computed on the server</text>
<circle cx="830" cy="176" r="13" class="stop"/>
<g class="icon" transform="translate(822,168)"><circle cx="8" cy="8" r="5.5"/><path d="M5.5 8.2l1.8 1.8 3.2-3.6"/></g>
<text x="830" y="211" class="name" text-anchor="middle">Verified copy</text>
<text x="830" y="228" class="sub" text-anchor="middle">checksums match</text>
<circle cx="980" cy="176" r="13" class="stop"/>
<g class="icon" transform="translate(972,168)"><path d="M9.5 2.5h-5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-7z"/><path d="M9.5 2.5v3h3M6 9h4M6 11.25h4"/></g>
<text x="980" y="211" class="name" text-anchor="middle">Old copies</text>
<text x="980" y="228" class="sub" text-anchor="middle">older than 30 days</text>
<circle cx="1130" cy="176" r="13" class="stop"/>
<g class="icon" transform="translate(1122,168)"><path d="M2.5 4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H7l-3 2.5v-2.5h-.5a1 1 0 0 1-1-1z"/><path d="M5.5 6.25h5M5.5 8.5h3"/></g>
<text x="1130" y="211" class="name" text-anchor="middle">Store log</text>
<text x="1130" y="228" class="sub" text-anchor="middle">one line per night</text>
<circle cx="1280" cy="88" r="13" class="stop end"/>
<g class="icon on-end" transform="translate(1272,80)"><path d="M2.5 4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H7l-3 2.5v-2.5h-.5a1 1 0 0 1-1-1z"/><path d="M5.5 6.25h5M5.5 8.5h3"/></g>
<text x="1280" y="46" class="name" text-anchor="middle">Morning report</text>
<text x="1280" y="63" class="sub" text-anchor="middle">sent to the team</text>
</svg>
