<svg id="dg-backup" class="dg dg-wide dg-auto" xmlns="http://www.w3.org/2000/svg" width="1360" height="264" viewBox="0 0 1360 264" role="img" aria-label="A nightly backup in seven steps, from the timer to the report.">
<style>
#dg-backup{display:block;flex:none;margin-inline:auto;font-family:var(--sans,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif)}
#dg-backup .ground{fill:var(--fig,#f2f3f9)}
#dg-backup .band{fill:var(--bg,#fbfbfe)}
#dg-backup .track{stroke:var(--line,#d3d6e3)}
#dg-backup .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-backup .head{fill:var(--text,#1c1f2e)}
#dg-backup .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-backup .stop.end{fill:var(--text,#1c1f2e)}
#dg-backup .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-backup .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-backup .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-backup .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-backup .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-backup .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-backup .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-backup .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-backup .sub,#dg-backup .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-backup .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
.js #dg-backup .pulse{display:block;animation:12.4s linear 2 both}
.js #dg-backup:not(.is-playing) .pulse{animation-play-state:paused}
@keyframes dg-backup-1{0%{transform:translate(239px,88px);opacity:0}0.97%{transform:translate(239px,88px);opacity:1}10.89%{transform:translate(359px,88px);opacity:1}12.9%{transform:translate(359px,88px);opacity:0}100%{transform:translate(359px,88px);opacity:0}}
.js #dg-backup .pulse-1{animation-name:dg-backup-1}
@keyframes dg-backup-2{0%{transform:translate(389px,88px);opacity:0}12.9%{transform:translate(389px,88px);opacity:0}13.87%{transform:translate(389px,88px);opacity:1}14.66%{transform:translate(402px,88px);opacity:1}21.53%{transform:translate(472px,176px);opacity:1}23.79%{transform:translate(509px,176px);opacity:1}25.81%{transform:translate(509px,176px);opacity:0}100%{transform:translate(509px,176px);opacity:0}}
.js #dg-backup .pulse-2{animation-name:dg-backup-2}
@keyframes dg-backup-3{0%{transform:translate(539px,176px);opacity:0}25.81%{transform:translate(539px,176px);opacity:0}26.77%{transform:translate(539px,176px);opacity:1}27.57%{transform:translate(552px,176px);opacity:1}34.43%{transform:translate(622px,88px);opacity:1}36.69%{transform:translate(659px,88px);opacity:1}38.71%{transform:translate(659px,88px);opacity:0}100%{transform:translate(659px,88px);opacity:0}}
.js #dg-backup .pulse-3{animation-name:dg-backup-3}
@keyframes dg-backup-4{0%{transform:translate(689px,88px);opacity:0}38.71%{transform:translate(689px,88px);opacity:0}39.68%{transform:translate(689px,88px);opacity:1}40.8%{transform:translate(708px,88px);opacity:1}47.42%{transform:translate(778px,176px);opacity:1}49.6%{transform:translate(815px,176px);opacity:1}51.61%{transform:translate(815px,176px);opacity:0}100%{transform:translate(815px,176px);opacity:0}}
.js #dg-backup .pulse-4{animation-name:dg-backup-4}
@keyframes dg-backup-5{0%{transform:translate(845px,176px);opacity:0}51.61%{transform:translate(845px,176px);opacity:0}52.58%{transform:translate(845px,176px);opacity:1}62.5%{transform:translate(965px,176px);opacity:1}64.52%{transform:translate(965px,176px);opacity:0}100%{transform:translate(965px,176px);opacity:0}}
.js #dg-backup .pulse-5{animation-name:dg-backup-5}
@keyframes dg-backup-6{0%{transform:translate(995px,176px);opacity:0}64.52%{transform:translate(995px,176px);opacity:0}65.48%{transform:translate(995px,176px);opacity:1}75.4%{transform:translate(1115px,176px);opacity:1}77.42%{transform:translate(1115px,176px);opacity:0}100%{transform:translate(1115px,176px);opacity:0}}
.js #dg-backup .pulse-6{animation-name:dg-backup-6}
@keyframes dg-backup-7{0%{transform:translate(1145px,176px);opacity:0}77.42%{transform:translate(1145px,176px);opacity:0}78.39%{transform:translate(1145px,176px);opacity:1}79.18%{transform:translate(1158px,176px);opacity:1}86.05%{transform:translate(1228px,88px);opacity:1}88.31%{transform:translate(1265px,88px);opacity:1}90.32%{transform:translate(1265px,88px);opacity:0}100%{transform:translate(1265px,88px);opacity:0}}
.js #dg-backup .pulse-7{animation-name:dg-backup-7}
@media (prefers-reduced-motion:reduce){#dg-backup .pulse{animation:none!important}#dg-backup .pulse{display:none!important}}
@media print{#dg-backup .pulse{display:none!important}}
</style>
<rect width="1360" height="264" class="ground"/>
<rect x="8" y="20" width="1344" height="100" rx="10" class="band"/>
<rect x="8" y="144" width="1344" height="100" rx="10" class="band"/>
<line x1="174" y1="88" x2="1336" y2="88" class="track"/>
<line x1="174" y1="176" x2="1336" y2="176" class="track"/>
<g class="icon lane-icon" transform="translate(24,60)"><rect x="2.5" y="2.5" width="11" height="4.5" rx="1"/><rect x="2.5" y="9" width="11" height="4.5" rx="1"/><path d="M5 4.75h.01M5 11.25h.01"/></g>
<text x="24" y="93" class="lane" text-anchor="start">Application server</text>
