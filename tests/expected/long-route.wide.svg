<g class="leg" data-leg="2"><path d="M389,88 L402,88 L472,176 L503,176" class="line"/><polygon points="501,180.5 501,171.5 509,176" class="head"/><circle cx="437" cy="132" r="10" class="mark"/><text x="437" y="136" class="num" text-anchor="middle">2</text><text x="453" y="136" class="verb" text-anchor="start">copy</text><circle r="6" class="pulse pulse-2"/></g>
<g class="leg" data-leg="3"><path d="M539,176 L552,176 L622,88 L653,88" class="line"/><polygon points="651,92.5 651,83.5 659,88" class="head"/><circle cx="587" cy="132" r="10" class="mark"/><text x="587" y="136" class="num" text-anchor="middle">3</text><text x="603" y="136" class="verb" text-anchor="start">ask for the checksum</text><circle r="6" class="pulse pulse-3"/></g>
<g class="leg" data-leg="4"><path d="M689,88 L708,88 L778,176 L809,176" class="line"/><polygon points="807,180.5 807,171.5 815,176" class="head"/><circle cx="743" cy="132" r="10" class="mark"/><text x="743" y="136" class="num" text-anchor="middle">4</text><text x="759" y="136" class="verb" text-anchor="start">compare</text><circle r="6" class="pulse pulse-4"/></g>
<g class="leg" data-leg="5"><path d="M845,176 L959,176" class="line"/><polygon points="957,180.5 957,171.5 965,176" class="head"/><circle cx="901" cy="176" r="10" class="mark"/><text x="901" y="180" class="num" text-anchor="middle">5</text><text x="901" y="154" class="verb" text-anchor="middle">find</text><circle r="6" class="pulse pulse-5"/></g>
<g class="leg" data-leg="6"><path d="M995,176 L1109,176" class="line"/><polygon points="1107,180.5 1107,171.5 1115,176" class="head"/><circle cx="1051" cy="176" r="10" class="mark"/><text x="1051" y="180" class="num" text-anchor="middle">6</text><text x="1051" y="154" class="verb" text-anchor="middle">delete and record</text><circle r="6" class="pulse pulse-6"/></g>
<g class="leg" data-leg="7"><path d="M1145,176 L1158,176 L1228,88 L1259,88" class="line"/><polygon points="1257,92.5 1257,83.5 1265,88" class="head"/><circle cx="1193" cy="132" r="10" class="mark"/><text x="1193" y="136" class="num" text-anchor="middle">7</text><text x="1209" y="136" class="verb" text-anchor="start">summarize</text><circle r="6" class="pulse pulse-7"/></g>
<circle cx="224" cy="88" r="13" class="stop"/>
<g class="icon" transform="translate(216,80)"><circle cx="7" cy="7" r="4"/><path d="M10 10l3.5 3.5"/></g>
<text x="224" y="46" class="name" text-anchor="middle">Night timer</text>
<text x="224" y="63" class="sub" text-anchor="middle">02:00 every day</text>
<circle cx="374" cy="88" r="13" class="stop"/>
<g class="icon" transform="translate(366,80)"><path d="M9.5 2.5h-5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-7z"/><path d="M9.5 2.5v3h3M6 9h4M6 11.25h4"/></g>
<text x="374" y="46" class="name" text-anchor="middle">Database dump</text>
<text x="374" y="63" class="sub" text-anchor="middle">one compressed file</text>
<circle cx="524" cy="176" r="13" class="stop"/>
<g class="icon" transform="translate(516,168)"><path d="M9.5 2.5h-5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-7z"/><path d="M9.5 2.5v3h3M6 9h4M6 11.25h4"/></g>
<text x="524" y="211" class="name" text-anchor="middle">Uploaded file</text>
