<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<ul><li>The component Web app.</li><li>The component Partner API.</li><li>The component Sign-in service.</li><li>The component Bot filter.</li><li>The component Tag manager.</li><li>The component Risk engine.</li></ul>
<ul><li>The interface Email codes: Sign-in service offers it, and Web app needs it.</li><li>The interface Bot check: Bot filter offers it, and Web app needs it.</li><li>The interface Analytics tags: Tag manager offers it, and Web app needs it.</li><li>The interface Device risk check: Risk engine offers it, and Web app, Partner API need it.</li></ul>
<p>Key to the marks:</p>
<ul><li>A box marked «component», with the component icon: a part of the system that can be replaced as a whole.</li><li>A ball on a line: a service, an interface, that the component at the line's other end offers.</li><li>A half circle around a ball: the component at the line's other end needs that service.</li></ul>
</details>
