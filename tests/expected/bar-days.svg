<svg id="dg-days-to-fix" class="dg dg-bar dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="266" viewBox="0 0 640 266" role="img" aria-label="The median time to fix a bug fell in three of five areas from 2025 to 2026. Settings fell most, from 15 days to 6. Checkout rose from 6 to 8. Profile stayed at 5.">
<style>
#dg-days-to-fix{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-days-to-fix .ground{fill:var(--fig,#f2f3f9)}
#dg-days-to-fix .band{fill:var(--bg,#fbfbfe)}
#dg-days-to-fix .track{stroke:var(--line,#d3d6e3)}
#dg-days-to-fix .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-days-to-fix .head{fill:var(--text,#1c1f2e)}
#dg-days-to-fix .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-days-to-fix .stop.end{fill:var(--text,#1c1f2e)}
#dg-days-to-fix .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-days-to-fix .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-days-to-fix .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-days-to-fix .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-days-to-fix .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-days-to-fix .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-days-to-fix .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-days-to-fix .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-days-to-fix .sub,#dg-days-to-fix .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-days-to-fix .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-days-to-fix .row{font-size:14px;fill:var(--text,#1c1f2e)}
#dg-days-to-fix .val{font-size:12px;fill:var(--muted,#575d75);font-variant-numeric:tabular-nums}
#dg-days-to-fix .r-bar{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-days-to-fix .r-ref{stroke:var(--muted,#575d75)}
#dg-days-to-fix .r-pt{fill:var(--text,#1c1f2e)}
#dg-days-to-fix .d-ring{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-days-to-fix .d-gap{stroke:var(--muted,#575d75);stroke-width:2}
#dg-days-to-fix .d-lead{stroke:var(--muted,#575d75);stroke-width:1}
@media (prefers-reduced-motion:reduce){#dg-days-to-fix .pulse{animation:none!important}#dg-days-to-fix .pulse{display:none!important}}
@media print{#dg-days-to-fix{max-width:100%;height:auto}#dg-days-to-fix .pulse{display:none!important}}
#dg-days-to-fix-phone{display:none}
</style>
