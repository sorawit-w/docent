#dg-leave .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-leave .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-leave .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-leave .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-leave .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-leave .sub,#dg-leave .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-leave .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
.js #dg-leave .pulse{display:block;animation:9.2s linear 2 both}
.js #dg-leave:not(.is-playing) .pulse{animation-play-state:paused}
