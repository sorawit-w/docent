<svg id="dg-review" class="dg dg-wide dg-auto" xmlns="http://www.w3.org/2000/svg" width="638" height="140" viewBox="0 0 638 140" role="img" aria-label="A text in three steps: draft, review and publish.">
<style>
#dg-review{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-review .ground{fill:var(--fig,#f2f3f9)}
#dg-review .band{fill:var(--bg,#fbfbfe)}
#dg-review .track{stroke:var(--line,#d3d6e3)}
#dg-review .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-review .head{fill:var(--text,#1c1f2e)}
#dg-review .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-review .stop.end{fill:var(--text,#1c1f2e)}
#dg-review .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-review .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-review .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-review .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-review .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-review .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-review .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-review .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-review .sub,#dg-review .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-review .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
.js #dg-review .pulse{display:block;animation:6s linear 2 both}
.js #dg-review:not(.is-playing) .pulse{animation-play-state:paused}
@keyframes dg-review-1{0%{transform:translate(148px,52px);opacity:0}2%{transform:translate(148px,52px);opacity:1}22.5%{transform:translate(268px,52px);opacity:1}26.67%{transform:translate(268px,52px);opacity:0}100%{transform:translate(268px,52px);opacity:0}}
.js #dg-review .pulse-1{animation-name:dg-review-1}
@keyframes dg-review-2{0%{transform:translate(288px,52px);opacity:0}26.67%{transform:translate(288px,52px);opacity:0}28.67%{transform:translate(288px,52px);opacity:1}49.17%{transform:translate(408px,52px);opacity:1}53.33%{transform:translate(408px,52px);opacity:0}100%{transform:translate(408px,52px);opacity:0}}
.js #dg-review .pulse-2{animation-name:dg-review-2}
@keyframes dg-review-3{0%{transform:translate(428px,52px);opacity:0}53.33%{transform:translate(428px,52px);opacity:0}55.33%{transform:translate(428px,52px);opacity:1}75.83%{transform:translate(548px,52px);opacity:1}80%{transform:translate(548px,52px);opacity:0}100%{transform:translate(548px,52px);opacity:0}}
.js #dg-review .pulse-3{animation-name:dg-review-3}
@media (prefers-reduced-motion:reduce){#dg-review .pulse{animation:none!important}#dg-review .pulse{display:none!important}}
@media print{#dg-review{max-width:100%;height:auto}#dg-review .pulse{display:none!important}}
#dg-review-phone{display:none}
</style>
<rect width="638" height="140" class="ground"/>
<rect x="8" y="20" width="622" height="100" rx="10" class="band"/>
<line x1="88" y1="52" x2="614" y2="52" class="track"/>
<text x="24" y="57" class="lane" text-anchor="start">Writer</text>
<g class="leg" data-leg="1"><path d="M148,52 L262,52" class="line"/><polygon points="260,56.5 260,47.5 268,52" class="head"/><circle r="6" class="pulse pulse-1"/><circle cx="204" cy="52" r="10" class="mark"/><text x="204" y="56" class="num" text-anchor="middle">1</text><text x="204" y="30" class="verb" text-anchor="middle">ask a colleague to read</text></g>
<g class="leg" data-leg="2"><path d="M288,52 L402,52" class="line"/><polygon points="400,56.5 400,47.5 408,52" class="head"/><circle r="6" class="pulse pulse-2"/><circle cx="344" cy="52" r="10" class="mark"/><text x="344" y="56" class="num" text-anchor="middle">2</text><text x="344" y="30" class="verb" text-anchor="middle">fix</text></g>
<g class="leg" data-leg="3"><path d="M428,52 L542,52" class="line"/><polygon points="540,56.5 540,47.5 548,52" class="head"/><circle r="6" class="pulse pulse-3"/><circle cx="484" cy="52" r="10" class="mark"/><text x="484" y="56" class="num" text-anchor="middle">3</text><text x="484" y="30" class="verb" text-anchor="middle">publish</text></g>
<circle cx="138" cy="52" r="8" class="stop"/>
<text x="138" y="87" class="name" text-anchor="middle">Draft</text>
<circle cx="278" cy="52" r="8" class="stop"/>
<text x="278" y="87" class="name" text-anchor="middle">Review copy</text>
<text x="278" y="104" class="sub" text-anchor="middle">with comments</text>
<circle cx="418" cy="52" r="8" class="stop"/>
<text x="418" y="87" class="name" text-anchor="middle">Final text</text>
<circle cx="558" cy="52" r="8" class="stop end"/>
<text x="558" y="87" class="name" text-anchor="middle">Published page</text>
<text x="558" y="104" class="sub" text-anchor="middle">on the public site</text>
</svg>
<svg id="dg-review-phone" class="dg dg-track dg-auto" xmlns="http://www.w3.org/2000/svg" width="264" height="416" viewBox="0 0 264 416" role="img" aria-label="A text in three steps: draft, review and publish.">
<style>
#dg-review-phone{flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-review-phone .ground{fill:var(--fig,#f2f3f9)}
#dg-review-phone .band{fill:var(--bg,#fbfbfe)}
