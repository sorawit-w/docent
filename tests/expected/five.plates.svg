<text x="754" y="44" class="lane" text-anchor="start">Testers</text>
<text x="992" y="44" class="lane" text-anchor="start">Release</text>
<g class="leg" data-leg="1"><path d="M148,116 L148,174 Q148,182 156,182 L270,182" class="line"/><polygon points="268,186.5 268,177.5 276,182" class="head"/><circle r="6" class="pulse pulse-1"/><circle cx="228" cy="182" r="10" class="mark"/><text x="228" y="186" class="num" text-anchor="middle">1</text><text x="228" y="163" class="verb" text-anchor="middle">send</text></g>
<g class="leg" data-leg="2"><path d="M386,208 L386,266 Q386,274 394,274 L508,274" class="line"/><polygon points="506,278.5 506,269.5 514,274" class="head"/><circle r="6" class="pulse pulse-2"/><circle cx="466" cy="274" r="10" class="mark"/><text x="466" y="278" class="num" text-anchor="middle">2</text><text x="466" y="255" class="verb" text-anchor="middle">approve</text></g>
<g class="leg" data-leg="3"><path d="M624,300 L624,358 Q624,366 632,366 L746,366" class="line"/><polygon points="744,370.5 744,361.5 752,366" class="head"/><circle r="6" class="pulse pulse-3"/><circle cx="704" cy="366" r="10" class="mark"/><text x="704" y="370" class="num" text-anchor="middle">3</text><text x="704" y="347" class="verb" text-anchor="middle">install</text></g>
<g class="leg" data-leg="4"><path d="M862,392 L862,450 Q862,458 870,458 L984,458" class="line"/><polygon points="982,462.5 982,453.5 990,458" class="head"/><circle r="6" class="pulse pulse-4"/><circle cx="942" cy="458" r="10" class="mark"/><text x="942" y="462" class="num" text-anchor="middle">4</text></g>
<rect x="40" y="64" width="138" height="52" rx="10" class="card"/>
<text x="58" y="87" class="name" text-anchor="start">Change</text>
<text x="58" y="104" class="sub" text-anchor="start">a short diff</text>
<rect x="278" y="156" width="138" height="52" rx="10" class="card"/>
<text x="296" y="179" class="name" text-anchor="start">Review</text>
<text x="296" y="196" class="sub" text-anchor="start">read once</text>
<rect x="516" y="248" width="138" height="52" rx="10" class="card"/>
<text x="534" y="271" class="name" text-anchor="start">Build</text>
<text x="534" y="288" class="sub" text-anchor="start">made and packed</text>
<rect x="754" y="340" width="138" height="52" rx="10" class="card"/>
<text x="772" y="363" class="name" text-anchor="start">Trial</text>
<text x="772" y="380" class="sub" text-anchor="start">on a test machine</text>
<rect x="992" y="432" width="138" height="52" rx="10" class="card"/>
<text x="1010" y="455" class="name" text-anchor="start">Release</text>
<text x="1010" y="472" class="sub" text-anchor="start">for everyone</text>
</svg>
