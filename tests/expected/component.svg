<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<ul><li>The component Web shop.</li><li>The component Back end.</li><li>The component Orders, inside Back end.</li><li>The component Stock, inside Back end.</li><li>The component Payments.</li></ul>
<ul><li>The interface OrderAPI: Back end offers it at the port api, and Web shop needs it.</li><li>The interface StockCheck: Stock offers it, and Orders needs it.</li><li>The interface Charge: Payments offers it, and Orders needs it.</li></ul>
<ul><li>Web shop depends on Payments.</li><li>Back end hands its work at the port api to Orders, inside it.</li></ul>
<p>Key to the marks:</p>
<ul><li>A box marked «component», with the component icon: a part of the system that can be replaced as a whole.</li><li>A ball on a line: a service, an interface, that the component at the line's other end offers.</li><li>A half circle around a ball: the component at the line's other end needs that service.</li><li>A small square on a border: a port, the point where the thing connects to the outside.</li><li>A dashed line with an open arrowhead: the component at the line's start needs the one at the arrowhead.</li><li>A line marked «delegate»: the outer component hands the work to the part inside it.</li></ul>
</details>
