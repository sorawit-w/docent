<svg id="dg-reports-by-area" class="dg dg-bar dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="308" viewBox="0 0 640 308" role="img" aria-label="Sign-in had the most bug reports in the third quarter, 412. Search and Checkout had about 250 each. Help pages had the fewest, 18. Notifications has no count, because reports had no area label for it before April.">
<style>
#dg-reports-by-area{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-reports-by-area .ground{fill:var(--fig,#f2f3f9)}
#dg-reports-by-area .band{fill:var(--bg,#fbfbfe)}
#dg-reports-by-area .track{stroke:var(--line,#d3d6e3)}
#dg-reports-by-area .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-reports-by-area .head{fill:var(--text,#1c1f2e)}
#dg-reports-by-area .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-reports-by-area .stop.end{fill:var(--text,#1c1f2e)}
#dg-reports-by-area .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-reports-by-area .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-reports-by-area .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-reports-by-area .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-reports-by-area .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-reports-by-area .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-reports-by-area .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-reports-by-area .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-reports-by-area .sub,#dg-reports-by-area .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-reports-by-area .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-reports-by-area .row{font-size:14px;fill:var(--text,#1c1f2e)}
#dg-reports-by-area .val{font-size:12px;fill:var(--muted,#575d75);font-variant-numeric:tabular-nums}
#dg-reports-by-area .r-bar{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-reports-by-area .r-ref{stroke:var(--muted,#575d75)}
#dg-reports-by-area .r-pt{fill:var(--text,#1c1f2e)}
#dg-reports-by-area .d-ring{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-reports-by-area .d-gap{stroke:var(--muted,#575d75);stroke-width:2}
#dg-reports-by-area .d-lead{stroke:var(--muted,#575d75);stroke-width:1}
@media (prefers-reduced-motion:reduce){#dg-reports-by-area .pulse{animation:none!important}#dg-reports-by-area .pulse{display:none!important}}
@media print{#dg-reports-by-area{max-width:100%;height:auto}#dg-reports-by-area .pulse{display:none!important}}
#dg-reports-by-area-phone{display:none}
</style>
