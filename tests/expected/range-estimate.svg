<svg id="dg-not-repeated" class="dg dg-range dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="About 18% of all reports could not be repeated. Search, Checkout and Settings had the highest shares, about 21% to 23%. Profile had the lowest, 9%, but its interval is wide, from 4% to 19%.">
