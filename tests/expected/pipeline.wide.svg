<svg id="dg-pipeline" class="dg dg-wide dg-auto" xmlns="http://www.w3.org/2000/svg" width="858" height="264" viewBox="0 0 858 264" role="img" aria-label="A change in four steps: the build passed, three tests failed, the review waits, and the release did not start.">
<style>
#dg-pipeline{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-pipeline .ground{fill:var(--fig,#f2f3f9)}
