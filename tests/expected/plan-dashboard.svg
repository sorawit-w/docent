<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<div class="table-wrap is-text" role="region" aria-label="The boxes of the plan" tabindex="0"><table><thead><tr><th scope="col">Box</th><th scope="col">Row</th><th scope="col">Column</th><th scope="col">Width</th><th scope="col">Note</th></tr></thead><tbody><tr><th scope="row">Header</th><td>top</td><td>full width</td><td>1440</td><td></td></tr><tr><th scope="row">Navigation</th><td>bottom</td><td>left</td><td>360</td><td></td></tr><tr><th scope="row">Revenue</th><td>bottom</td><td>column 2</td><td>360</td><td></td></tr><tr><th scope="row">Sign-ups</th><td>bottom</td><td>column 3</td><td>360</td><td></td></tr><tr><th scope="row">Open tickets</th><td>bottom</td><td>right</td><td>360</td><td>the five oldest</td></tr></tbody></table></div>
<p>Widths are in px. The rows are not drawn to scale. On a phone each box stands on its own, beside a small map of the plan.</p>
</details>
