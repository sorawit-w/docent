<rect x="16.5" y="298.5" width="39" height="7" class="m-box"/><rect x="16.5" y="306.5" width="9" height="7" class="m-box"/><rect x="26.5" y="306.5" width="9" height="7" class="m-box"/><rect x="36.5" y="306.5" width="9" height="7" class="m-box"/><rect x="46.5" y="306.5" width="9" height="7" class="m-on"/>
