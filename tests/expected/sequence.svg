<g class="leg" data-leg="3"><path d="M244.5,246 L416.5,246" class="line"/><polygon points="414.5,250.5 414.5,241.5 422.5,246" class="head"/><circle r="6" class="pulse pulse-3"/><circle cx="333.5" cy="246" r="10" class="mark"/><text x="333.5" y="250" class="num" text-anchor="middle">3</text><text x="333.5" y="230" class="verb" text-anchor="middle">read</text></g>
<g class="leg is-reply" data-leg="4"><path d="M422.5,290 L250.5,290" class="line"/><polyline points="252.5,285.5 244.5,290 252.5,294.5" class="ohead"/><circle r="6" class="pulse pulse-4"/><circle cx="333.5" cy="290" r="10" class="mark"/><text x="333.5" y="294" class="num" text-anchor="middle">4</text><text x="333.5" y="274" class="verb" text-anchor="middle">page</text></g>
