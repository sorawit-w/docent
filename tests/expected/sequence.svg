<svg id="dg-page" class="dg dg-sequence dg-auto" xmlns="http://www.w3.org/2000/svg" width="668" height="506" viewBox="0 0 668 506" role="img" aria-label="The browser asks for a page. The web app checks the session, then reads the page from the cache, or from the database when the cache does not have it, and sends the page back.">
<style>
#dg-page{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-page .ground{fill:var(--fig,#f2f3f9)}
#dg-page .band{fill:var(--bg,#fbfbfe)}
#dg-page .track{stroke:var(--line,#d3d6e3)}
#dg-page .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-page .head{fill:var(--text,#1c1f2e)}
#dg-page .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-page .stop.end{fill:var(--text,#1c1f2e)}
#dg-page .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-page .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-page .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-page .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-page .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-page .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-page .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-page .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-page .sub,#dg-page .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-page .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-page .leg.is-reply .line{stroke:var(--muted,#575d75);stroke-width:1.5}
#dg-page .ohead{fill:none;stroke:var(--muted,#575d75);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.js #dg-page .leg.is-reply.is-current .ohead{stroke:var(--primary,#2f3fd0)}
.js #dg-page .pulse{display:block;animation:12.4s linear 2 both}
.js #dg-page:not(.is-playing) .pulse{animation-play-state:paused}
@keyframes dg-page-1{0%{transform:translate(66.5px,86px);opacity:0}0.97%{transform:translate(66.5px,86px);opacity:1}10.89%{transform:translate(244.5px,86px);opacity:1}12.9%{transform:translate(244.5px,86px);opacity:0}100%{transform:translate(244.5px,86px);opacity:0}}
.js #dg-page .pulse-1{animation-name:dg-page-1}
@keyframes dg-page-2{0%{transform:translate(244.5px,124px);opacity:0}12.9%{transform:translate(244.5px,124px);opacity:0}13.87%{transform:translate(244.5px,124px);opacity:1}16.99%{transform:translate(288.5px,124px);opacity:1}20.67%{transform:translate(288.5px,176px);opacity:1}23.79%{transform:translate(244.5px,176px);opacity:1}25.81%{transform:translate(244.5px,176px);opacity:0}100%{transform:translate(244.5px,176px);opacity:0}}
.js #dg-page .pulse-2{animation-name:dg-page-2}
@keyframes dg-page-3{0%{transform:translate(244.5px,246px);opacity:0}25.81%{transform:translate(244.5px,246px);opacity:0}26.77%{transform:translate(244.5px,246px);opacity:1}36.69%{transform:translate(422.5px,246px);opacity:1}38.71%{transform:translate(422.5px,246px);opacity:0}100%{transform:translate(422.5px,246px);opacity:0}}
.js #dg-page .pulse-3{animation-name:dg-page-3}
@keyframes dg-page-4{0%{transform:translate(422.5px,290px);opacity:0}38.71%{transform:translate(422.5px,290px);opacity:0}39.68%{transform:translate(422.5px,290px);opacity:1}49.6%{transform:translate(244.5px,290px);opacity:1}51.61%{transform:translate(244.5px,290px);opacity:0}100%{transform:translate(244.5px,290px);opacity:0}}
.js #dg-page .pulse-4{animation-name:dg-page-4}
@keyframes dg-page-5{0%{transform:translate(244.5px,374px);opacity:0}51.61%{transform:translate(244.5px,374px);opacity:0}52.58%{transform:translate(244.5px,374px);opacity:1}62.5%{transform:translate(600.5px,374px);opacity:1}64.52%{transform:translate(600.5px,374px);opacity:0}100%{transform:translate(600.5px,374px);opacity:0}}
.js #dg-page .pulse-5{animation-name:dg-page-5}
@keyframes dg-page-6{0%{transform:translate(600.5px,418px);opacity:0}64.52%{transform:translate(600.5px,418px);opacity:0}65.48%{transform:translate(600.5px,418px);opacity:1}75.4%{transform:translate(244.5px,418px);opacity:1}77.42%{transform:translate(244.5px,418px);opacity:0}100%{transform:translate(244.5px,418px);opacity:0}}
.js #dg-page .pulse-6{animation-name:dg-page-6}
@keyframes dg-page-7{0%{transform:translate(244.5px,472px);opacity:0}77.42%{transform:translate(244.5px,472px);opacity:0}78.39%{transform:translate(244.5px,472px);opacity:1}88.31%{transform:translate(66.5px,472px);opacity:1}90.32%{transform:translate(66.5px,472px);opacity:0}100%{transform:translate(66.5px,472px);opacity:0}}
.js #dg-page .pulse-7{animation-name:dg-page-7}
@media (prefers-reduced-motion:reduce){#dg-page .pulse{animation:none!important}#dg-page .pulse{display:none!important}}
@media print{#dg-page{max-width:100%;height:auto}#dg-page .pulse{display:none!important}}
#dg-page-phone{display:none}
</style>
