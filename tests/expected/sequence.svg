<svg id="dg-page-phone" class="dg dg-script dg-auto" xmlns="http://www.w3.org/2000/svg" width="264" height="404" viewBox="0 0 264 404" role="img" aria-label="The browser asks for a page. The web app checks the session, then reads the page from the cache, or from the database when the cache does not have it, and sends the page back.">
<style>
#dg-page-phone{flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-page-phone .ground{fill:var(--fig,#f2f3f9)}
#dg-page-phone .band{fill:var(--bg,#fbfbfe)}
#dg-page-phone .track{stroke:var(--line,#d3d6e3)}
#dg-page-phone .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-page-phone .head{fill:var(--text,#1c1f2e)}
#dg-page-phone .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-page-phone .stop.end{fill:var(--text,#1c1f2e)}
#dg-page-phone .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-page-phone .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-page-phone .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-page-phone .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-page-phone .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-page-phone .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-page-phone .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-page-phone .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-page-phone .sub,#dg-page-phone .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-page-phone .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
.js #dg-page-phone .pulse{display:block;animation:1.2s linear 2 both}
.js #dg-page-phone:not(.is-playing) .pulse{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){#dg-page-phone .pulse{animation:none!important}#dg-page-phone .pulse{display:none!important}}
@media print{#dg-page-phone{max-width:100%;height:auto}#dg-page-phone .pulse{display:none!important}}
@media (max-width:764px){#dg-page{display:none}#dg-page-phone{display:block}}
@media print{#dg-page{display:block!important}#dg-page-phone{display:none!important}}
</style>
<rect width="264" height="404" class="ground"/>
<rect x="8" y="100" width="248" height="116" rx="10" class="band"/>
<rect x="8" y="228" width="248" height="116" rx="10" class="band"/>
<text x="20" y="116" class="sub" text-anchor="start">If the cache has the page</text>
<text x="20" y="244" class="sub" text-anchor="start">If not</text>
<g class="jump" data-leg="1"><circle cx="32" cy="28" r="10" class="mark"/><text x="32" y="32" class="num" text-anchor="middle">1</text><text x="52" y="26" class="name" text-anchor="start">Browser → Web app</text><text x="52" y="43" class="verb" text-anchor="start">ask for the page</text></g>
<g class="jump" data-leg="2"><circle cx="32" cy="72" r="10" class="mark"/><text x="32" y="76" class="num" text-anchor="middle">2</text><text x="52" y="70" class="name" text-anchor="start">Web app → itself</text><text x="52" y="87" class="verb" text-anchor="start">check the session</text></g>
<g class="jump" data-leg="3"><circle cx="32" cy="140" r="10" class="mark"/><text x="32" y="144" class="num" text-anchor="middle">3</text><text x="52" y="138" class="name" text-anchor="start">Web app → Cache</text><text x="52" y="155" class="verb" text-anchor="start">read</text></g>
<g class="jump" data-leg="4"><circle cx="32" cy="184" r="10" class="mark"/><text x="32" y="188" class="num" text-anchor="middle">4</text><text x="52" y="182" class="name" text-anchor="start">Cache → Web app</text><text x="52" y="199" class="verb" text-anchor="start">reply: page</text></g>
<g class="jump" data-leg="5"><circle cx="32" cy="268" r="10" class="mark"/><text x="32" y="272" class="num" text-anchor="middle">5</text><text x="52" y="266" class="name" text-anchor="start">Web app → Database</text><text x="52" y="283" class="verb" text-anchor="start">query</text></g>
<g class="jump" data-leg="6"><circle cx="32" cy="312" r="10" class="mark"/><text x="32" y="316" class="num" text-anchor="middle">6</text><text x="52" y="310" class="name" text-anchor="start">Database → Web app</text><text x="52" y="327" class="verb" text-anchor="start">reply: rows</text></g>
<g class="jump" data-leg="7"><circle cx="32" cy="372" r="10" class="mark"/><text x="32" y="376" class="num" text-anchor="middle">7</text><text x="52" y="370" class="name" text-anchor="start">Web app → Browser</text><text x="52" y="387" class="verb" text-anchor="start">reply: page</text></g>
</svg>
<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<ol><li value="1">Browser to Web app: ask for the page.</li><li value="2">Web app to itself: check the session.</li></ol>
<p>If the cache has the page:</p>
<ol><li value="3">Web app to Cache: read.</li><li value="4">Cache to Web app: page (a reply).</li></ol>
<p>If not:</p>
<ol><li value="5">Web app to Database: query.</li><li value="6">Database to Web app: rows (a reply).</li></ol>
<ol><li value="7">Web app to Browser: page (a reply).</li></ol>
</details>
