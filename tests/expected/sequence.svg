<svg id="dg-page" class="dg dg-sequence dg-auto" xmlns="http://www.w3.org/2000/svg" width="746" height="496" viewBox="0 0 746 496" role="img" aria-label="The browser asks for a page. The web app checks the session, then reads the page from the cache, or from the database when the cache does not have it, and sends the page back.">
<style>
