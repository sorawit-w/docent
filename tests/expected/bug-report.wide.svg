<svg id="dg-path" class="dg dg-wide dg-auto" xmlns="http://www.w3.org/2000/svg" width="858" height="264" viewBox="0 0 858 264" role="img" aria-label="A bug report in four steps: the reporter files a report, the maintainers ask for steps, the reporter sends the steps, and the maintainers release a fix.">
<style>
#dg-path{display:block;flex:none;margin-inline:auto;font-family:var(--sans,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif)}
