<svg id="dg-signup-may" class="dg dg-funnel dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="284" viewBox="0 0 640 284" role="img" aria-label="Of 12,480 people who opened the sign-up page in May, 1,860 finished the sign-up: 15%. The largest number left before the form: 4,240. The largest share left at the email check: half of the people who filled in the form did not confirm their email.">
<style>
#dg-signup-may{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-signup-may .ground{fill:var(--fig,#f2f3f9)}
#dg-signup-may .band{fill:var(--bg,#fbfbfe)}
#dg-signup-may .track{stroke:var(--line,#d3d6e3)}
#dg-signup-may .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-signup-may .head{fill:var(--text,#1c1f2e)}
#dg-signup-may .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-signup-may .stop.end{fill:var(--text,#1c1f2e)}
#dg-signup-may .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-signup-may .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-signup-may .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-signup-may .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-signup-may .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-signup-may .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-signup-may .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-signup-may .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-signup-may .sub,#dg-signup-may .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-signup-may .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-signup-may .row{font-size:14px;fill:var(--text,#1c1f2e)}
#dg-signup-may .val{font-size:12px;fill:var(--muted,#575d75);font-variant-numeric:tabular-nums}
#dg-signup-may .r-bar{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-signup-may .f-lost{fill:var(--line,#d3d6e3)}
@media (prefers-reduced-motion:reduce){#dg-signup-may .pulse{animation:none!important}#dg-signup-may .pulse{display:none!important}}
@media print{#dg-signup-may{max-width:100%;height:auto}#dg-signup-may .pulse{display:none!important}}
#dg-signup-may-phone{display:none}
</style>
