<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<div class="table-wrap is-text" role="region" aria-label="The steps of the funnel" tabindex="0"><table><thead><tr><th scope="col">Step</th><th scope="col">People</th><th scope="col">Share of the first step</th><th scope="col">Left since the step before</th><th scope="col">Share of the step before</th></tr></thead><tbody><tr><th scope="row">Open the sign-up page</th><td>12,480</td><td>100%</td><td colspan="2">first step</td></tr><tr><th scope="row">Fill in the form</th><td>8,240</td><td>66%</td><td>4,240</td><td>34%</td></tr><tr><th scope="row">Confirm the email</th><td>4,120</td><td>33%</td><td>4,120</td><td>50%</td></tr><tr><th scope="row">Choose a plan</th><td>2,900</td><td>23%</td><td>1,220</td><td>30%</td></tr><tr><th scope="row">Finish the sign-up</th><td>1,860</td><td>15%</td><td>1,040</td><td>36%</td></tr></tbody></table></div>
<ul><li>Of 12,480 people at the first step, 1,860 reached the last step: 15%.</li><li>The most people left between "Open the sign-up page" and "Fill in the form": 4,240.</li><li>The largest share left between "Fill in the form" and "Confirm the email": 50% of the step before.</li><li>The bars are to scale, from 0.</li></ul>
