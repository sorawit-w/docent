<svg id="dg-days-to-fix-slope" class="dg dg-line dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="308" viewBox="0 0 640 308" role="img" aria-label="The median time to fix a bug fell in three of five areas from 2025 to 2026. Settings fell most, from 15 days to 6. Checkout rose from 6 to 8. Profile stayed at 5.">
