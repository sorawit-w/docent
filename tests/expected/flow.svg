.js #dg-job .pulse-4{animation-name:dg-job-4}
@keyframes dg-job-5{0%{transform:translate(190px,638px);opacity:0}51.61%{transform:translate(190px,638px);opacity:0}52.58%{transform:translate(190px,638px);opacity:1}62.5%{transform:translate(190px,710px);opacity:1}64.52%{transform:translate(190px,710px);opacity:0}100%{transform:translate(190px,710px);opacity:0}}
.js #dg-job .pulse-5{animation-name:dg-job-5}
@keyframes dg-job-6{0%{transform:translate(190px,764px);opacity:0}64.52%{transform:translate(190px,764px);opacity:0}65.48%{transform:translate(190px,764px);opacity:1}75.4%{transform:translate(190px,1020px);opacity:1}77.42%{transform:translate(190px,1020px);opacity:0}100%{transform:translate(190px,1020px);opacity:0}}
.js #dg-job .pulse-6{animation-name:dg-job-6}
@keyframes dg-job-7{0%{transform:translate(190px,1074px);opacity:0}77.42%{transform:translate(190px,1074px);opacity:0}78.39%{transform:translate(190px,1074px);opacity:1}88.31%{transform:translate(190px,1146px);opacity:1}90.32%{transform:translate(190px,1146px);opacity:0}100%{transform:translate(190px,1146px);opacity:0}}
.js #dg-job .pulse-7{animation-name:dg-job-7}
@media (prefers-reduced-motion:reduce){#dg-job .pulse{animation:none!important}#dg-job .pulse{display:none!important}}
@media print{#dg-job{max-width:100%;height:auto}#dg-job .pulse{display:none!important}}
#dg-job-phone{display:none}
</style>
