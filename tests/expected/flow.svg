<text x="58" y="55" class="name" text-anchor="start">Get the job</text>
<rect x="40" y="150" width="300" height="52" rx="10" class="card"/>
<text x="58" y="181" class="name" text-anchor="start">Read the input</text>
<path d="M48,276 L332,276 L340,302 L332,328 L48,328 L40,302 Z" class="card"/>
