<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<ol><li>Get the job.</li><li>Read the input.</li><li>Input valid? If yes: Set up. If no: Refuse the job.</li><li>Refuse the job. The path ends here.</li><li>Set up.</li><li>Run the work.</li><li>Result good? If yes: Save the result. If no: Tries left?</li><li>Tries left? If yes: Run the work. If no: Report a failure.</li><li>Report a failure. The path ends here.</li><li>Save the result.</li><li>Done.</li></ol>
</details>
