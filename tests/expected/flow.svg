<svg id="dg-job" class="dg dg-flow dg-auto" xmlns="http://www.w3.org/2000/svg" width="780" height="1228" viewBox="0 0 780 1228" role="img" aria-label="A job is read, set up and run. A bad input stops it. A bad result is run again while tries are left; when none are left, a failure is reported.">
<style>
#dg-job{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-job .ground{fill:var(--fig,#f2f3f9)}
#dg-job .band{fill:var(--bg,#fbfbfe)}
#dg-job .track{stroke:var(--line,#d3d6e3)}
#dg-job .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-job .head{fill:var(--text,#1c1f2e)}
#dg-job .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-job .stop.end{fill:var(--text,#1c1f2e)}
#dg-job .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-job .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-job .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-job .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-job .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-job .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-job .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-job .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-job .sub,#dg-job .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-job .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-job .card.is-stop{stroke:var(--text,#1c1f2e);stroke-width:2}
.js #dg-job .pulse{display:block;animation:12.4s linear 2 both}
.js #dg-job:not(.is-playing) .pulse{animation-play-state:paused}
@keyframes dg-job-1{0%{transform:translate(190px,76px);opacity:0}0.97%{transform:translate(190px,76px);opacity:1}10.89%{transform:translate(190px,148px);opacity:1}12.9%{transform:translate(190px,148px);opacity:0}100%{transform:translate(190px,148px);opacity:0}}
.js #dg-job .pulse-1{animation-name:dg-job-1}
@keyframes dg-job-2{0%{transform:translate(190px,202px);opacity:0}12.9%{transform:translate(190px,202px);opacity:0}13.87%{transform:translate(190px,202px);opacity:1}23.79%{transform:translate(190px,274px);opacity:1}25.81%{transform:translate(190px,274px);opacity:0}100%{transform:translate(190px,274px);opacity:0}}
.js #dg-job .pulse-2{animation-name:dg-job-2}
@keyframes dg-job-3{0%{transform:translate(190px,328px);opacity:0}25.81%{transform:translate(190px,328px);opacity:0}26.77%{transform:translate(190px,328px);opacity:1}36.69%{transform:translate(190px,458px);opacity:1}38.71%{transform:translate(190px,458px);opacity:0}100%{transform:translate(190px,458px);opacity:0}}
