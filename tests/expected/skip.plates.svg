<svg id="dg-skip" class="dg dg-plates dg-auto" xmlns="http://www.w3.org/2000/svg" width="540" height="648" viewBox="0 0 540 648" role="img" aria-label="A request goes through a check. A small request skips the review and goes to the answer; this path is optional.">
<style>
#dg-skip{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-skip .ground{fill:var(--fig,#f2f3f9)}
#dg-skip .band{fill:var(--bg,#fbfbfe)}
#dg-skip .track{stroke:var(--line,#d3d6e3)}
#dg-skip .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-skip .head{fill:var(--text,#1c1f2e)}
#dg-skip .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-skip .stop.end{fill:var(--text,#1c1f2e)}
#dg-skip .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-skip .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-skip .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-skip .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-skip .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-skip .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-skip .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-skip .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-skip .sub,#dg-skip .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-skip .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-skip .leg.is-optional .line{stroke-dasharray:5 7}
.js #dg-skip .pulse{display:block;animation:9.2s linear 2 both}
.js #dg-skip:not(.is-playing) .pulse{animation-play-state:paused}
@keyframes dg-skip-1{0%{transform:translate(190px,116px);opacity:0}1.3%{transform:translate(190px,116px);opacity:1}14.67%{transform:translate(190px,188px);opacity:1}17.39%{transform:translate(190px,188px);opacity:0}100%{transform:translate(190px,188px);opacity:0}}
.js #dg-skip .pulse-1{animation-name:dg-skip-1}
@keyframes dg-skip-2{0%{transform:translate(190px,242px);opacity:0}17.39%{transform:translate(190px,242px);opacity:0}18.7%{transform:translate(190px,242px);opacity:1}32.07%{transform:translate(190px,314px);opacity:1}34.78%{transform:translate(190px,314px);opacity:0}100%{transform:translate(190px,314px);opacity:0}}
.js #dg-skip .pulse-2{animation-name:dg-skip-2}
@keyframes dg-skip-3{0%{transform:translate(340px,216px);opacity:0}34.78%{transform:translate(340px,216px);opacity:0}36.09%{transform:translate(340px,216px);opacity:1}38.81%{transform:translate(426px,216px);opacity:1}46.8%{transform:translate(426px,468px);opacity:1}49.46%{transform:translate(342px,468px);opacity:1}52.17%{transform:translate(342px,468px);opacity:0}100%{transform:translate(342px,468px);opacity:0}}
.js #dg-skip .pulse-3{animation-name:dg-skip-3}
@keyframes dg-skip-4{0%{transform:translate(190px,368px);opacity:0}52.17%{transform:translate(190px,368px);opacity:0}53.48%{transform:translate(190px,368px);opacity:1}66.85%{transform:translate(190px,440px);opacity:1}69.57%{transform:translate(190px,440px);opacity:0}100%{transform:translate(190px,440px);opacity:0}}
.js #dg-skip .pulse-4{animation-name:dg-skip-4}
@keyframes dg-skip-5{0%{transform:translate(190px,494px);opacity:0}69.57%{transform:translate(190px,494px);opacity:0}70.87%{transform:translate(190px,494px);opacity:1}84.24%{transform:translate(190px,566px);opacity:1}86.96%{transform:translate(190px,566px);opacity:0}100%{transform:translate(190px,566px);opacity:0}}
.js #dg-skip .pulse-5{animation-name:dg-skip-5}
@media (prefers-reduced-motion:reduce){#dg-skip .pulse{animation:none!important}#dg-skip .pulse{display:none!important}}
@media print{#dg-skip{max-width:100%;height:auto}#dg-skip .pulse{display:none!important}}
#dg-skip-phone{display:none}
</style>
