<svg id="dg-a4-notes" class="dg dg-layout dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="96" viewBox="0 0 640 96" role="img" aria-label="An A4 page is 210mm wide: an 18mm margin, a 112mm text column, an 8mm gap, a 50mm note column, 4mm left over, and an 18mm margin.">
<style>
#dg-a4-notes{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-a4-notes .ground{fill:var(--fig,#f2f3f9)}
#dg-a4-notes .band{fill:var(--bg,#fbfbfe)}
#dg-a4-notes .track{stroke:var(--line,#d3d6e3)}
#dg-a4-notes .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-a4-notes .head{fill:var(--text,#1c1f2e)}
#dg-a4-notes .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-a4-notes .stop.end{fill:var(--text,#1c1f2e)}
#dg-a4-notes .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-a4-notes .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-a4-notes .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-a4-notes .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-a4-notes .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-a4-notes .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-a4-notes .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-a4-notes .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-a4-notes .sub,#dg-a4-notes .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-a4-notes .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-a4-notes .row{font-size:14px;fill:var(--text,#1c1f2e)}
#dg-a4-notes .val{font-size:12px;fill:var(--muted,#575d75);font-variant-numeric:tabular-nums}
#dg-a4-notes .box{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-a4-notes .tick{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1}
#dg-a4-notes .r-ref{stroke:var(--muted,#575d75)}
@media (prefers-reduced-motion:reduce){#dg-a4-notes .pulse{animation:none!important}#dg-a4-notes .pulse{display:none!important}}
@media print{#dg-a4-notes{max-width:100%;height:auto}#dg-a4-notes .pulse{display:none!important}}
#dg-a4-notes-phone{display:none}
</style>
