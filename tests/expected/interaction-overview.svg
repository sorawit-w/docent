<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<ol><li>Start.</li><li>The interaction “<a href="#dg-login">Log in</a>” happens here; its steps are in its own diagram.</li><li>The interaction “Pay for the order” happens here.</li><li>Decide: if paid, go to the fork; if failed, go to Pay for the order.</li><li>The path splits; these run at the same time: Send the receipt; Tell the warehouse.</li><li>The interaction “Send the receipt” happens here.</li><li>Wait here until every path that comes in is done.</li><li>It ends.</li><li>The interaction “Tell the warehouse” happens here. Then back to the join after Send the receipt.</li></ol>
<p>Key to the marks:</p>
<ul><li>A filled dot: where it starts.</li><li>A frame marked ref: an interaction whose messages are drawn in its own sequence diagram.</li><li>A hollow diamond: the path splits by a condition, or paths join again.</li><li>A thick bar: the path splits into paths that run at the same time, or those paths wait for each other.</li><li>A ring around a filled dot: the activity ends.</li><li>A solid line with an open arrowhead: the order of the steps. A condition in brackets says when that path is taken.</li></ul>
</details>
