<svg id="dg-checkout-overview" class="dg dg-interaction-overview dg-auto" xmlns="http://www.w3.org/2000/svg" width="504" height="912" viewBox="0 0 504 912" role="img" aria-label="A customer logs in, then pays. A failed payment is tried again; a paid order gets a receipt and the warehouse is told, at the same time.">
<style>
#dg-checkout-overview{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-checkout-overview .ground{fill:var(--fig,#f2f3f9)}
#dg-checkout-overview .band{fill:var(--bg,#fbfbfe)}
#dg-checkout-overview .track{stroke:var(--line,#d3d6e3)}
#dg-checkout-overview .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-checkout-overview .head{fill:var(--text,#1c1f2e)}
#dg-checkout-overview .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-checkout-overview .stop.end{fill:var(--text,#1c1f2e)}
#dg-checkout-overview .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-checkout-overview .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-checkout-overview .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-checkout-overview .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-checkout-overview .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-checkout-overview .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-checkout-overview .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-checkout-overview .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-checkout-overview .sub,#dg-checkout-overview .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-checkout-overview .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-checkout-overview .u-ln{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-checkout-overview .u-bold{stroke-width:2.5}
#dg-checkout-overview .u-dash{stroke-dasharray:6 4;stroke-linecap:butt}
#dg-checkout-overview .u-face{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linejoin:round}
#dg-checkout-overview .u-ink{fill:var(--text,#1c1f2e)}
#dg-checkout-overview .u-name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-checkout-overview .leg .line{stroke-width:1.5}
#dg-checkout-overview .leg.is-reply .line{stroke-dasharray:6 4;stroke-linecap:butt}
#dg-checkout-overview .ohead{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
