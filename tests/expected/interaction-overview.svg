#dg-checkout-overview .u-frame.is-filled{fill:var(--bg,#fbfbfe)}
#dg-checkout-overview .u-div{stroke:var(--muted,#575d75);stroke-width:1;stroke-dasharray:6 4}
#dg-checkout-overview .u-op{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e)}
