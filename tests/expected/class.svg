<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<ul><li>Customer. Attributes: “- id: UUID”, “- email: String”. Operations: “+ placeOrder(): Order”.</li><li>Order. Attributes: “- total: Money”, “- count: Integer” (static). Operations: “+ addLine(p: Product, n: Integer)”, “+ pay(with: Payment)”.</li><li>OrderLine. Attributes: “- quantity: Integer”.</li><li>Product. Attributes: “- name: String”, “- price: Money”.</li><li>Payment («interface»). Operations: “+ charge(amount: Money): Boolean” (abstract).</li><li>CardPayment. Attributes: “- last4: String”. Operations: “+ charge(amount: Money): Boolean”.</li></ul>
<ul><li>Customer is linked to 0..* Order, by “places”; each Order to 1 Customer; the link is used from Customer to Order.</li><li>Order owns 1..* OrderLine as “lines”; an OrderLine cannot exist without its Order.</li><li>OrderLine is linked to 1 Product; each Product to * OrderLine; the link is used from OrderLine to Product.</li><li>CardPayment implements the interface Payment.</li><li>Order depends on Payment («use»).</li></ul>
<ul><li>A note on Order: {total = sum of the line prices}</li></ul>
<p>Key to the marks:</p>
<ul><li>A box in parts: a class. The name is at the top; under the first line are its attributes, under the second its operations.</li><li>A word in «»: what kind of class it is, such as an interface.</li><li>A name in italics: abstract; it has no instances of its own, only kinds of it do.</li><li>An underlined member: it belongs to the class, not to each instance.</li><li>The sign before a member: + public, - private, # protected, ~ package.</li><li>A solid line: the two classes are linked. An open arrowhead shows the direction in which the link is used; a name sits beside the line.</li><li>A filled diamond: the whole at the diamond owns the part, and the part cannot exist without it.</li><li>A dashed line with a hollow triangle: the thing at the line's start does what the thing at the triangle describes.</li><li>A dashed line with an open arrowhead: the thing at the line's start needs the thing at the arrowhead.</li><li>A number or range at the end of a line, such as 1 or 0..*: how many of the class at that end take part. * means any number.</li><li>A box with a folded corner, joined by a dashed line: a note on that class.</li></ul>
</details>
