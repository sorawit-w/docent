#dg-persistence-profile .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-persistence-profile .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-persistence-profile .sub,#dg-persistence-profile .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-persistence-profile .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-persistence-profile .u-ln{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-persistence-profile .u-bold{stroke-width:2.5}
