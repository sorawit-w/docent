<svg id="dg-persistence-profile" class="dg dg-profile dg-auto" xmlns="http://www.w3.org/2000/svg" width="648" height="384" viewBox="0 0 648 384" role="img" aria-label="The persistence profile adds two stereotypes. Entity extends Class and has a table name; Id extends Property. The shop model applies the profile.">
<style>
#dg-persistence-profile{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-persistence-profile .ground{fill:var(--fig,#f2f3f9)}
