<svg id="dg-wide-layouts" class="dg dg-layout dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="368" viewBox="0 0 640 368" role="img" aria-label="On a 1920px screen today, the text and its notes sit left of the middle. Layout A centers them and lets wide blocks grow to the right. Layout B centers the text and the wide blocks, so the left edge splits. Layout C adds a contents list on the left.">
<style>
#dg-wide-layouts{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-wide-layouts .ground{fill:var(--fig,#f2f3f9)}
#dg-wide-layouts .band{fill:var(--bg,#fbfbfe)}
#dg-wide-layouts .track{stroke:var(--line,#d3d6e3)}
#dg-wide-layouts .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-wide-layouts .head{fill:var(--text,#1c1f2e)}
#dg-wide-layouts .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-wide-layouts .stop.end{fill:var(--text,#1c1f2e)}
#dg-wide-layouts .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-wide-layouts .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-wide-layouts .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-wide-layouts .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-wide-layouts .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-wide-layouts .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-wide-layouts .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-wide-layouts .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-wide-layouts .sub,#dg-wide-layouts .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-wide-layouts .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-wide-layouts .row{font-size:14px;fill:var(--text,#1c1f2e)}
#dg-wide-layouts .val{font-size:12px;fill:var(--muted,#575d75);font-variant-numeric:tabular-nums}
#dg-wide-layouts .box{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-wide-layouts .tick{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1}
#dg-wide-layouts .r-ref{stroke:var(--muted,#575d75)}
@media (prefers-reduced-motion:reduce){#dg-wide-layouts .pulse{animation:none!important}#dg-wide-layouts .pulse{display:none!important}}
@media print{#dg-wide-layouts{max-width:100%;height:auto}#dg-wide-layouts .pulse{display:none!important}}
#dg-wide-layouts-phone{display:none}
</style>
