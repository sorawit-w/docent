<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<ol><li>At 0 s: User is Idle. Controller is Ready. Door is Closed.</li><li>At 1 s: User sends “press” to Controller. User becomes Waiting. Controller becomes Busy.</li><li>At 3 s: Controller sends “open” to Door. Controller becomes Ready. Door becomes Moving.</li><li>At 4 s: User becomes Idle. Door becomes Open.</li><li>At 8 s: Door becomes Moving.</li><li>At 9 s: Door becomes Closed.</li></ol>
<ul><li>From 1 s to 4 s, Door keeps the constraint {≤ 3 s}.</li></ul>
<p>Key to the marks:</p>
<ul><li>A thick line that steps up and down: the state of the lifeline over time, read against the state names at its left.</li><li>A line with an open arrowhead, from one state line to another: a message from one lifeline to another at that moment.</li><li>A line with a tick at each end and a constraint in braces: how long that stretch may take.</li></ul>
</details>
