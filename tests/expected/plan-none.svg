<svg id="dg-no-widths" class="dg dg-plan dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="172" viewBox="0 0 640 172" role="img" aria-label="A documentation page 1440px wide. A header runs across the top and a footer across the bottom. Between them, the navigation is on the left, the text in the middle, and an 'On this page' list on the right.">
<style>
#dg-no-widths{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-no-widths .ground{fill:var(--fig,#f2f3f9)}
#dg-no-widths .band{fill:var(--bg,#fbfbfe)}
#dg-no-widths .track{stroke:var(--line,#d3d6e3)}
#dg-no-widths .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-no-widths .head{fill:var(--text,#1c1f2e)}
#dg-no-widths .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-no-widths .stop.end{fill:var(--text,#1c1f2e)}
#dg-no-widths .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-no-widths .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-no-widths .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-no-widths .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-no-widths .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-no-widths .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-no-widths .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-no-widths .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-no-widths .sub,#dg-no-widths .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-no-widths .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-no-widths .row{font-size:14px;fill:var(--text,#1c1f2e)}
#dg-no-widths .val{font-size:12px;fill:var(--muted,#575d75);font-variant-numeric:tabular-nums}
#dg-no-widths .box{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
@media (prefers-reduced-motion:reduce){#dg-no-widths .pulse{animation:none!important}#dg-no-widths .pulse{display:none!important}}
@media print{#dg-no-widths{max-width:100%;height:auto}#dg-no-widths .pulse{display:none!important}}
#dg-no-widths-phone{display:none}
</style>
