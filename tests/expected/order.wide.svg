.js #dg-order .pulse-2{animation-name:dg-order-2}
@keyframes dg-order-3{0%{transform:translate(513px,300px);opacity:0}42.11%{transform:translate(513px,300px);opacity:0}43.68%{transform:translate(513px,300px);opacity:1}59.87%{transform:translate(633px,300px);opacity:1}63.16%{transform:translate(633px,300px);opacity:0}100%{transform:translate(633px,300px);opacity:0}}
.js #dg-order .pulse-3{animation-name:dg-order-3}
@keyframes dg-order-4{0%{transform:translate(663px,300px);opacity:0}63.16%{transform:translate(663px,300px);opacity:0}64.74%{transform:translate(663px,300px);opacity:1}65.51%{transform:translate(676px,300px);opacity:1}78.73%{transform:translate(746px,88px);opacity:1}80.92%{transform:translate(783px,88px);opacity:1}84.21%{transform:translate(783px,88px);opacity:0}100%{transform:translate(783px,88px);opacity:0}}
.js #dg-order .pulse-4{animation-name:dg-order-4}
@media (prefers-reduced-motion:reduce){#dg-order .pulse{animation:none!important}#dg-order .pulse{display:none!important}}
@media print{#dg-order .pulse{display:none!important}}
#dg-order-phone{display:none}
