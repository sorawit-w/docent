<svg id="dg-shop-deploy" class="dg dg-deployment dg-auto" xmlns="http://www.w3.org/2000/svg" width="1116" height="672" viewBox="0 0 1116 672" role="img" aria-label="Where the shop runs: a phone talks to the app server over HTTPS, and the server talks to the database.">
<style>
#dg-shop-deploy{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-shop-deploy .ground{fill:var(--fig,#f2f3f9)}
#dg-shop-deploy .band{fill:var(--bg,#fbfbfe)}
#dg-shop-deploy .track{stroke:var(--line,#d3d6e3)}
#dg-shop-deploy .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-shop-deploy .head{fill:var(--text,#1c1f2e)}
#dg-shop-deploy .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-shop-deploy .stop.end{fill:var(--text,#1c1f2e)}
#dg-shop-deploy .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-shop-deploy .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-shop-deploy .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-shop-deploy .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-shop-deploy .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-shop-deploy .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-shop-deploy .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-shop-deploy .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-shop-deploy .sub,#dg-shop-deploy .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-shop-deploy .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-shop-deploy .u-ln{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-shop-deploy .u-bold{stroke-width:2.5}
#dg-shop-deploy .u-dash{stroke-dasharray:6 4;stroke-linecap:butt}
#dg-shop-deploy .u-face{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linejoin:round}
#dg-shop-deploy .u-ink{fill:var(--text,#1c1f2e)}
#dg-shop-deploy .u-name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-shop-deploy .leg .line{stroke-width:1.5}
#dg-shop-deploy .leg.is-reply .line{stroke-dasharray:6 4;stroke-linecap:butt}
#dg-shop-deploy .ohead{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.js #dg-shop-deploy .leg.is-current .ohead{stroke:var(--primary,#2f3fd0)}
#dg-shop-deploy .u-bar{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-shop-deploy .u-frame{fill:none;stroke:var(--muted,#575d75);stroke-width:1}
#dg-shop-deploy .u-frame.is-filled{fill:var(--bg,#fbfbfe)}
#dg-shop-deploy .u-div{stroke:var(--muted,#575d75);stroke-width:1;stroke-dasharray:6 4}
#dg-shop-deploy .u-op{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-shop-deploy .u-mem{font-size:12px;fill:var(--text,#1c1f2e)}
#dg-shop-deploy .u-it{font-style:italic}
#dg-shop-deploy .u-ul{text-decoration:underline}
@media (prefers-reduced-motion:reduce){#dg-shop-deploy .pulse{animation:none!important}#dg-shop-deploy .pulse{display:none!important}}
@media print{#dg-shop-deploy{max-width:100%;height:auto}#dg-shop-deploy .pulse{display:none!important}}
#dg-shop-deploy-phone{display:none}
</style>
