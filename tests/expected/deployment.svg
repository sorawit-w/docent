<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<ul><li>The device Phone, runs shop.apk.</li><li>The device App server.</li><li>The execution environment JVM, inside App server, runs shop.jar.</li><li>The device Database server, runs schema.sql.</li></ul>
<ul><li>Phone talks to App server over HTTPS.</li><li>JVM talks to Database server over JDBC.</li><li>The artifact shop.apk makes the component Mobile app real.</li></ul>
<p>Key to the marks:</p>
<ul><li>A 3D box: a node, a computer or a runtime, marked «device» or «executionEnvironment».</li><li>A box marked «artifact», with the page icon: a file, such as a program, that runs on a node.</li><li>A solid line between nodes: a communication path, with its protocol when known.</li><li>A box marked «component», with the component icon: a part of the system that can be replaced as a whole.</li><li>A dashed line marked «manifest»: the artifact makes the component real.</li></ul>
</details>
