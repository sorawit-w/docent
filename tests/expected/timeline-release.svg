<svg id="dg-release-support" class="dg dg-timeline dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="332" viewBox="0 0 640 332" role="img" aria-label="Version 4 is in beta for all of November and is released on 1 December 2026. From then, version 3 gets security fixes only, until its support ends on 1 April 2027: four months to move.">
