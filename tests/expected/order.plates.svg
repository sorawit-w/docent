<svg id="dg-order" class="dg dg-plates dg-auto" xmlns="http://www.w3.org/2000/svg" width="1102" height="546" viewBox="0 0 1102 546" role="img" aria-label="An order in four steps: the customer places an order, the shop sends a pick list, the warehouse packs a parcel, and the parcel goes to the customer.">
<style>
#dg-order{display:block;flex:none;margin-inline:auto;font-family:var(--sans,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif)}
#dg-order .ground{fill:var(--fig,#f2f3f9)}
#dg-order .band{fill:var(--bg,#fbfbfe)}
#dg-order .track{stroke:var(--line,#d3d6e3)}
#dg-order .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-order .head{fill:var(--text,#1c1f2e)}
#dg-order .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-order .stop.end{fill:var(--text,#1c1f2e)}
#dg-order .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-order .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-order .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-order .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-order .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-order .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-order .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-order .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-order .sub,#dg-order .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-order .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
.js #dg-order .pulse{display:block;animation:7.6s linear 2 both}
.js #dg-order:not(.is-playing) .pulse{animation-play-state:paused}
@keyframes dg-order-1{0%{transform:translate(284px,116px);opacity:0}1.58%{transform:translate(284px,116px);opacity:1}7.08%{transform:translate(284px,182px);opacity:1}17.76%{transform:translate(412px,182px);opacity:1}21.05%{transform:translate(412px,182px);opacity:0}100%{transform:translate(412px,182px);opacity:0}}
.js #dg-order .pulse-1{animation-name:dg-order-1}
@keyframes dg-order-2{0%{transform:translate(658px,208px);opacity:0}21.05%{transform:translate(658px,208px);opacity:0}22.63%{transform:translate(658px,208px);opacity:1}28.14%{transform:translate(658px,274px);opacity:1}38.82%{transform:translate(786px,274px);opacity:1}42.11%{transform:translate(786px,274px);opacity:0}100%{transform:translate(786px,274px);opacity:0}}
.js #dg-order .pulse-2{animation-name:dg-order-2}
@keyframes dg-order-3{0%{transform:translate(925px,300px);opacity:0}42.11%{transform:translate(925px,300px);opacity:0}43.68%{transform:translate(925px,300px);opacity:1}59.87%{transform:translate(925px,372px);opacity:1}63.16%{transform:translate(925px,372px);opacity:0}100%{transform:translate(925px,372px);opacity:0}}
.js #dg-order .pulse-3{animation-name:dg-order-3}
@keyframes dg-order-4{0%{transform:translate(818px,426px);opacity:0}63.16%{transform:translate(818px,426px);opacity:0}64.74%{transform:translate(818px,426px);opacity:1}66.62%{transform:translate(818px,492px);opacity:1}80.92%{transform:translate(316px,492px);opacity:1}84.21%{transform:translate(316px,492px);opacity:0}100%{transform:translate(316px,492px);opacity:0}}
.js #dg-order .pulse-4{animation-name:dg-order-4}
@media (prefers-reduced-motion:reduce){#dg-order .pulse{animation:none!important}#dg-order .pulse{display:none!important}}
@media print{#dg-order{max-width:100%;height:auto}#dg-order .pulse{display:none!important}}
#dg-order-phone{display:none}
</style>
