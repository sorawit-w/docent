<svg id="dg-nightly-builds" class="dg dg-statusgrid dg-auto" xmlns="http://www.w3.org/2000/svg" width="640" height="192" viewBox="0 0 640 192" role="img" aria-label="Nightly builds of four projects in the week of 16 November. The mobile app failed on Tuesday and Wednesday; every other build passed.">
