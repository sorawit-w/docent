<form class="checks" id="wd-release" aria-labelledby="wd-release-t">
<p class="wd-t" id="wd-release-t">Before a release</p>
<ul>
<li><input type="checkbox" id="wd-release-1"><label for="wd-release-1">All tests pass.</label></li>
<li><input type="checkbox" id="wd-release-2"><label for="wd-release-2">The version in <code>package.json</code> is new.<span class="sub">A version that exists already cannot be published again.</span></label></li>
<li><input type="checkbox" id="wd-release-3"><label for="wd-release-3">The change log has an entry.</label></li>
<li><input type="checkbox" id="wd-release-4"><label for="wd-release-4">A second person read the change.</label></li>
</ul>
<p class="wd-foot"><output></output><button class="wd-btn" type="reset">Clear the ticks</button></p>
</form>
