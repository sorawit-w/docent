<svg id="dg-checkout-talk" class="dg dg-communication dg-auto" xmlns="http://www.w3.org/2000/svg" width="504" height="360" viewBox="0 0 504 360" role="img" aria-label="Checkout asks the cart to place the order; the cart reserves each item with stock, then asks payments to charge the card.">
<style>
#dg-checkout-talk{display:block;flex:none;margin-inline:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#dg-checkout-talk .ground{fill:var(--fig,#f2f3f9)}
#dg-checkout-talk .band{fill:var(--bg,#fbfbfe)}
#dg-checkout-talk .track{stroke:var(--line,#d3d6e3)}
#dg-checkout-talk .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-checkout-talk .head{fill:var(--text,#1c1f2e)}
#dg-checkout-talk .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-checkout-talk .stop.end{fill:var(--text,#1c1f2e)}
#dg-checkout-talk .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-checkout-talk .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-checkout-talk .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-checkout-talk .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-checkout-talk .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-checkout-talk .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-checkout-talk .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-checkout-talk .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-checkout-talk .sub,#dg-checkout-talk .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-checkout-talk .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-checkout-talk .u-ln{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-checkout-talk .u-bold{stroke-width:2.5}
#dg-checkout-talk .u-dash{stroke-dasharray:6 4;stroke-linecap:butt}
#dg-checkout-talk .u-face{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linejoin:round}
#dg-checkout-talk .u-ink{fill:var(--text,#1c1f2e)}
#dg-checkout-talk .u-name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-checkout-talk .leg .line{stroke-width:1.5}
#dg-checkout-talk .leg.is-reply .line{stroke-dasharray:6 4;stroke-linecap:butt}
#dg-checkout-talk .ohead{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.js #dg-checkout-talk .leg.is-current .ohead{stroke:var(--primary,#2f3fd0)}
#dg-checkout-talk .u-bar{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-checkout-talk .u-frame{fill:none;stroke:var(--muted,#575d75);stroke-width:1}
#dg-checkout-talk .u-frame.is-filled{fill:var(--bg,#fbfbfe)}
#dg-checkout-talk .u-div{stroke:var(--muted,#575d75);stroke-width:1;stroke-dasharray:6 4}
#dg-checkout-talk .u-op{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e)}
@media (prefers-reduced-motion:reduce){#dg-checkout-talk .pulse{animation:none!important}#dg-checkout-talk .pulse{display:none!important}}
@media print{#dg-checkout-talk{max-width:100%;height:auto}#dg-checkout-talk .pulse{display:none!important}}
#dg-checkout-talk-phone{display:none}
</style>
<rect width="504" height="360" class="ground"/>
<g class="leg" data-leg="1"><polyline points="288,76 288,164" class="u-ln"/><text x="296" y="92" class="verb" text-anchor="start">1: placeOrder() ↓</text><text x="280" y="92" class="verb" text-anchor="end">2: showReceipt() ↑</text></g>
<g class="leg" data-leg="2"><polyline points="228,180 96,180 96,284" class="u-ln"/><text x="104" y="220" class="verb" text-anchor="start">1.1 *[i=1..n]: reserve(item) ↓</text></g>
<g class="leg" data-leg="3"><polyline points="288,196 288,284" class="u-ln"/><text x="296" y="212" class="verb" text-anchor="start">1.2 [all reserved]: charge(total) ↓</text><text x="296" y="236" class="verb" text-anchor="start">1.3: receipt ↑</text></g>
<rect x="228" y="44" width="120" height="32" class="u-face"/><text x="288" y="64" class="name" text-anchor="middle">: Checkout</text>
<rect x="228" y="164" width="120" height="32" class="u-face"/><text x="288" y="184" class="name" text-anchor="middle">c : Cart</text>
<rect x="36" y="284" width="120" height="32" class="u-face"/><text x="96" y="304" class="name" text-anchor="middle">: Stock</text>
<rect x="228" y="284" width="120" height="32" class="u-face"/><text x="288" y="304" class="name" text-anchor="middle">: Payments</text>
</svg>
