<rect width="264" height="478" class="ground"/>
<rect x="20" y="16" width="120" height="32" class="u-face"/><text x="80" y="36" class="name" text-anchor="middle">: Checkout</text>
<polyline points="20,67 68,67" class="u-ln"/><polyline points="60,71.5 68,67 60,62.5" class="u-ln"/>
<text x="80" y="71" class="verb" text-anchor="start">1: placeOrder()</text>
<text x="80" y="89" class="name" text-anchor="start">c : Cart</text>
<rect x="20" y="120" width="120" height="32" class="u-face"/><text x="80" y="140" class="name" text-anchor="middle">c : Cart</text>
<polyline points="20,171 68,171" class="u-ln"/><polyline points="60,175.5 68,171 60,166.5" class="u-ln"/>
<text x="80" y="175" class="verb" text-anchor="start">1.1 *[i=1..n]: reserve(item)</text>
<text x="80" y="193" class="name" text-anchor="start">: Stock</text>
<polyline points="20,213 68,213" class="u-ln"/><polyline points="60,217.5 68,213 60,208.5" class="u-ln"/>
<text x="80" y="217" class="verb" text-anchor="start">1.2 [all reserved]:</text>
<text x="80" y="235" class="verb" text-anchor="start">charge(total)</text>
<text x="80" y="253" class="name" text-anchor="start">: Payments</text>
<polyline points="20,273 68,273" class="u-ln"/><polyline points="60,277.5 68,273 60,268.5" class="u-ln"/>
<text x="80" y="277" class="verb" text-anchor="start">2: showReceipt()</text>
<text x="80" y="295" class="name" text-anchor="start">: Checkout</text>
<rect x="20" y="326" width="120" height="32" class="u-face"/><text x="80" y="346" class="name" text-anchor="middle">: Stock</text>
<rect x="20" y="378" width="120" height="32" class="u-face"/><text x="80" y="398" class="name" text-anchor="middle">: Payments</text>
<polyline points="20,429 68,429" class="u-ln"/><polyline points="60,433.5 68,429 60,424.5" class="u-ln"/>
<text x="80" y="433" class="verb" text-anchor="start">1.3: receipt</text>
<text x="80" y="451" class="name" text-anchor="start">c : Cart</text>
</svg>
<details class="dg-words">
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>The diagram in words</summary>
<ol><li>1. : Checkout sends placeOrder() to c : Cart.</li><li>1.1. c : Cart sends reserve(item) to : Stock, again and again: i=1..n.</li><li>1.2. c : Cart sends charge(total) to : Payments, only if all reserved.</li><li>1.3. : Payments sends receipt to c : Cart.</li><li>2. c : Cart sends showReceipt() to : Checkout.</li></ol>
<p>Key to the marks:</p>
<ul><li>A box: one participant, named role : Type.</li><li>A solid line: the two participants know each other, so they can send messages.</li><li>Text beside a line with a small arrow: a message, sent the way the arrow points.</li><li>The number before a message: its order. 1.1 and 1.2 happen inside message 1, before message 2.</li><li>[condition] after the number: the message is sent only when the condition holds.</li><li>*[…] after the number: the message is sent again and again, as the brackets say.</li></ul>
</details>
