<div class="decide" id="wd-plan">
<p class="wd-t" id="wd-plan-t">Which plan fits?</p>
<form class="decide-ask" aria-labelledby="wd-plan-t">
<fieldset><legend>How many people use it?</legend>
<input type="radio" name="wd-plan-q1" id="wd-plan-q1-1"><label class="opt" for="wd-plan-q1-1">One</label>
<input type="radio" name="wd-plan-q1" id="wd-plan-q1-2"><label class="opt" for="wd-plan-q1-2">2 to 10</label>
<input type="radio" name="wd-plan-q1" id="wd-plan-q1-3"><label class="opt" for="wd-plan-q1-3">More</label>
</fieldset>
<fieldset><legend>Do you need <code>SSO</code>?</legend>
<input type="radio" name="wd-plan-q2" id="wd-plan-q2-1"><label class="opt" for="wd-plan-q2-1">Yes</label>
<input type="radio" name="wd-plan-q2" id="wd-plan-q2-2"><label class="opt" for="wd-plan-q2-2">No</label>
</fieldset>
<output class="decide-out"></output>
<p class="wd-foot"><button class="wd-btn" type="reset">Start again</button></p>
</form>
<details open>
<summary><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>All cases</summary>
<div class="table-wrap" role="region" aria-label="All cases: Which plan fits?" tabindex="0">
<table>
<thead><tr><th scope="col">People</th><th scope="col">Do you need <code>SSO</code>?</th><th scope="col">Answer</th></tr></thead>
<tbody>
<tr data-when="1,2"><td>One</td><td>No</td><td><strong>Free</strong>One person, with no shared folders.</td></tr>
<tr data-when="2,2"><td>2 to 10</td><td>No</td><td><strong>Team</strong>Shared folders for up to ten people.</td></tr>
<tr data-when="3,2"><td>More</td><td>No</td><td><strong>Business</strong>No limit on people.</td></tr>
<tr data-when="0,1"><td>Any</td><td>Yes</td><td><strong>Business</strong>Only this plan has <code>SSO</code>.</td></tr>
</tbody>
</table>
</div>
</details>
</div>
