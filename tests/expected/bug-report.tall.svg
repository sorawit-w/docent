<svg id="dg-path" class="dg dg-tall" xmlns="http://www.w3.org/2000/svg" width="468" height="568" viewBox="0 0 468 568" role="img" aria-label="A bug report in four steps: the reporter files a report, the maintainers ask for steps, the reporter sends the steps, and the maintainers release a fix.">
<style>
#dg-path{display:block;flex:none;margin-inline:auto;font-family:var(--sans,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif)}
#dg-path .ground{fill:var(--fig,#f2f3f9)}
#dg-path .band{fill:var(--bg,#fbfbfe)}
#dg-path .track{stroke:var(--line,#d3d6e3)}
#dg-path .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-path .head{fill:var(--text,#1c1f2e)}
#dg-path .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-path .stop.end{fill:var(--text,#1c1f2e)}
#dg-path .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-path .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-path .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-path .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-path .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-path .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-path .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-path .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-path .sub,#dg-path .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-path .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
.js #dg-path .leg.is-current .line{stroke:var(--primary,#2f3fd0);stroke-width:2.5}
.js #dg-path .leg.is-current .head,.js #dg-path .leg.is-current .num{fill:var(--primary,#2f3fd0)}
.js #dg-path .leg.is-current .mark{stroke:var(--primary,#2f3fd0)}
.js #dg-path .leg.is-current .pulse{display:block;animation:2.4s linear infinite}
@keyframes dg-path-1{0%{transform:translate(157px,111px);opacity:0}8%{transform:translate(157px,111px);opacity:1}10.44%{transform:translate(157px,120px);opacity:1}58.25%{transform:translate(331px,150px);opacity:1}68%{transform:translate(331px,186px);opacity:1}88%{transform:translate(331px,186px);opacity:1}100%{transform:translate(331px,186px);opacity:0}}
#dg-path .pulse-1{transform:translate(198.76px,127.2px)}
.js #dg-path .leg.is-current .pulse-1{animation-name:dg-path-1}
@keyframes dg-path-2{0%{transform:translate(331px,216px);opacity:0}8%{transform:translate(331px,216px);opacity:1}10.44%{transform:translate(331px,225px);opacity:1}58.25%{transform:translate(157px,255px);opacity:1}68%{transform:translate(157px,291px);opacity:1}88%{transform:translate(157px,291px);opacity:1}100%{transform:translate(157px,291px);opacity:0}}
#dg-path .pulse-2{transform:translate(289.24px,232.2px)}
.js #dg-path .leg.is-current .pulse-2{animation-name:dg-path-2}
@keyframes dg-path-3{0%{transform:translate(157px,321px);opacity:0}8%{transform:translate(157px,321px);opacity:1}10.44%{transform:translate(157px,330px);opacity:1}58.25%{transform:translate(331px,360px);opacity:1}68%{transform:translate(331px,396px);opacity:1}88%{transform:translate(331px,396px);opacity:1}100%{transform:translate(331px,396px);opacity:0}}
#dg-path .pulse-3{transform:translate(198.76px,337.2px)}
.js #dg-path .leg.is-current .pulse-3{animation-name:dg-path-3}
@keyframes dg-path-4{0%{transform:translate(331px,426px);opacity:0}8%{transform:translate(331px,426px);opacity:1}68%{transform:translate(331px,501px);opacity:1}88%{transform:translate(331px,501px);opacity:1}100%{transform:translate(331px,501px);opacity:0}}
#dg-path .pulse-4{transform:translate(331px,435px)}
.js #dg-path .leg.is-current .pulse-4{animation-name:dg-path-4}
@media (prefers-reduced-motion:reduce){#dg-path .pulse{animation:none!important}}
@media print{#dg-path .pulse{display:none!important}#dg-path .leg .line{stroke:var(--text,#1c1f2e)!important;stroke-width:2px!important}#dg-path .leg .head,#dg-path .leg .num{fill:var(--text,#1c1f2e)!important}#dg-path .leg .mark{stroke:var(--text,#1c1f2e)!important}}
</style>
<rect width="468" height="568" class="ground"/>
<rect x="8" y="12" width="224" height="544" rx="10" class="band"/>
<rect x="256" y="12" width="204" height="544" rx="10" class="band"/>
<line x1="157" y1="62" x2="157" y2="542" class="track"/>
<line x1="331" y1="62" x2="331" y2="542" class="track"/>
<g class="icon lane-icon" transform="translate(22,29)"><circle cx="8" cy="5" r="2.5"/><path d="M3 13.5c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5"/></g>
<text x="46" y="42" class="lane" text-anchor="start">Reporter</text>
<g class="icon lane-icon" transform="translate(270,29)"><circle cx="6" cy="5.5" r="2.25"/><path d="M1.75 13c0-2.4 1.9-3.75 4.25-3.75s4.25 1.35 4.25 3.75M10.5 3.5a2.25 2.25 0 0 1 0 4.25M12 9.6c1.4.5 2.25 1.7 2.25 3.4"/></g>
<text x="294" y="42" class="lane" text-anchor="start">Maintainers</text>
<g class="leg" data-leg="1"><path d="M157,111 L157,120 L331,150 L331,180" class="line"/><polygon points="326.5,178 335.5,178 331,186" class="head"/><circle cx="244" cy="135" r="10" class="mark"/><text x="244" y="139" class="num" text-anchor="middle">1</text><text x="244" y="118" class="verb" text-anchor="middle">file</text><circle r="6" class="pulse pulse-1"/></g>
<g class="leg" data-leg="2"><path d="M331,216 L331,225 L157,255 L157,285" class="line"/><polygon points="152.5,283 161.5,283 157,291" class="head"/><circle cx="244" cy="240" r="10" class="mark"/><text x="244" y="244" class="num" text-anchor="middle">2</text><text x="244" y="223" class="verb" text-anchor="middle">ask for steps</text><circle r="6" class="pulse pulse-2"/></g>
<g class="leg" data-leg="3"><path d="M157,321 L157,330 L331,360 L331,390" class="line"/><polygon points="326.5,388 335.5,388 331,396" class="head"/><circle cx="244" cy="345" r="10" class="mark"/><text x="244" y="349" class="num" text-anchor="middle">3</text><text x="244" y="328" class="verb" text-anchor="middle">send steps</text><circle r="6" class="pulse pulse-3"/></g>
<g class="leg" data-leg="4"><path d="M331,426 L331,495" class="line"/><polygon points="326.5,493 335.5,493 331,501" class="head"/><circle cx="331" cy="459.5" r="10" class="mark"/><text x="331" y="463.5" class="num" text-anchor="middle">4</text><text x="352" y="463.5" class="verb" text-anchor="start">release</text><circle r="6" class="pulse pulse-4"/></g>
<circle cx="157" cy="96" r="13" class="stop"/>
<g class="icon" transform="translate(149,88)"><path d="M9.5 2.5h-5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-7z"/><path d="M9.5 2.5v3h3M6 9h4M6 11.25h4"/></g>
<text x="136" y="101" class="name" text-anchor="end">Bug report</text>
<text x="136" y="118" class="sub" text-anchor="end">what went wrong</text>
<circle cx="331" cy="201" r="13" class="stop"/>
<g class="icon" transform="translate(323,193)"><circle cx="7" cy="7" r="4"/><path d="M10 10l3.5 3.5"/></g>
<text x="352" y="206" class="name" text-anchor="start">Triage</text>
<text x="352" y="223" class="sub" text-anchor="start">a first check</text>
<circle cx="157" cy="306" r="13" class="stop"/>
<g class="icon" transform="translate(149,298)"><path d="M2.5 4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H7l-3 2.5v-2.5h-.5a1 1 0 0 1-1-1z"/><path d="M5.5 6.25h5M5.5 8.5h3"/></g>
<text x="136" y="311" class="name" text-anchor="end">Steps to repeat</text>
<text x="136" y="328" class="sub" text-anchor="end">a short, exact list</text>
<circle cx="331" cy="411" r="13" class="stop"/>
<g class="icon" transform="translate(323,403)"><circle cx="8" cy="8" r="5.5"/><path d="M5.5 8.2l1.8 1.8 3.2-3.6"/></g>
<text x="352" y="416" class="name" text-anchor="start">Fix</text>
<text x="352" y="433" class="sub" text-anchor="start">a tested change</text>
<circle cx="331" cy="516" r="13" class="stop end"/>
<g class="icon on-end" transform="translate(323,508)"><path d="M2.5 8.4V3.5a1 1 0 0 1 1-1h4.9l5.1 5.1a1 1 0 0 1 0 1.4l-4.5 4.5a1 1 0 0 1-1.4 0z"/><path d="M5.6 5.6h.01"/></g>
<text x="352" y="521" class="name" text-anchor="start">New version</text>
<text x="352" y="538" class="sub" text-anchor="start">ready to install</text>
</svg>
