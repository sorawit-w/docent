<svg id="dg-pipeline" class="dg dg-plates dg-auto" xmlns="http://www.w3.org/2000/svg" width="780" height="546" viewBox="0 0 780 546" role="img" aria-label="A change in four steps: the build passed, three tests failed, the review waits, and the release did not start.">
<style>
#dg-pipeline{display:block;flex:none;margin-inline:auto;font-family:var(--sans,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif)}
#dg-pipeline .ground{fill:var(--fig,#f2f3f9)}
#dg-pipeline .band{fill:var(--bg,#fbfbfe)}
#dg-pipeline .track{stroke:var(--line,#d3d6e3)}
#dg-pipeline .line{fill:none;stroke:var(--text,#1c1f2e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dg-pipeline .head{fill:var(--text,#1c1f2e)}
#dg-pipeline .stop{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.5}
#dg-pipeline .stop.end{fill:var(--text,#1c1f2e)}
#dg-pipeline .mark{fill:var(--bg,#fbfbfe);stroke:var(--text,#1c1f2e);stroke-width:1.25}
#dg-pipeline .card{fill:var(--bg,#fbfbfe);stroke:var(--line,#d3d6e3)}
#dg-pipeline .icon{fill:none;stroke:var(--text,#1c1f2e);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dg-pipeline .icon.on-end{stroke:var(--bg,#fbfbfe)}
#dg-pipeline .icon.lane-icon{stroke:var(--muted,#575d75)}
#dg-pipeline .num{font-size:12px;font-weight:600;fill:var(--text,#1c1f2e);font-variant-numeric:tabular-nums}
#dg-pipeline .name{font-size:14px;font-weight:600;fill:var(--text,#1c1f2e)}
#dg-pipeline .lane{font-size:14px;font-weight:600;fill:var(--muted,#575d75)}
#dg-pipeline .sub,#dg-pipeline .verb{font-size:12px;fill:var(--muted,#575d75)}
#dg-pipeline .pulse{display:none;fill:var(--dot,#2f3fd0);stroke:var(--bg,#fbfbfe);stroke-width:2.5}
#dg-pipeline .stop.is-ok,#dg-pipeline .card.is-ok{stroke:var(--ok,#1a7f37);stroke-width:1.5}
#dg-pipeline .flag.is-ok{fill:var(--ok,#1a7f37);stroke:var(--bg,#fbfbfe);stroke-width:2}
