<circle cx="30" cy="56" r="8" class="stop"/>
<text x="51" y="61" class="name" text-anchor="start">Draft</text>
<circle cx="30" cy="160" r="8" class="stop"/>
<text x="51" y="165" class="name" text-anchor="start">Review copy</text>
<text x="51" y="182" class="sub" text-anchor="start">with comments</text>
